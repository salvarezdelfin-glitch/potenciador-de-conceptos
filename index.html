  if(I&&I.E.v>=.4&&a.std<.18)P.push(`Contraste bajo para un proyecto que pide ${polo('E',I.E.v)}: la agresión vive en el contraste de valor y de borde.`);
  /* foco y detalle */
  if(a.foco2)P.push(`Dos focos compiten: ${a.foco.zona} y ${a.foco2.zona} (mira la vista FOCO). Baja el contraste o el detalle de uno.`);else F.push(`Un foco claro: ${a.foco.zona}.`);
  if(a.foco.borde)P.push('El foco está pegado al borde: el ojo se sale de la imagen.');
  else if(a.foco.centro<.08&&!/Personaje|Criatura|Prop|Arma/.test(tipo))Q.push('El foco está justo al centro. ¿Es una composición simétrica intencional (icono, frontalidad) o te quedó ahí por default?');
  if(a.detalle<.33)P.push(`El detalle está repartido parejo por toda la imagen (el 20% más detallado concentra solo ${pct(a.detalle)}). Sin zonas de descanso no hay jerarquía: simplifica fuera del foco.`);
  else if(a.detalle>.55)F.push(`Detalle concentrado (${pct(a.detalle)} en el 20% de la imagen): hay jerarquía y zonas de descanso.`);
  /* color */
  const sinColor=ETAPA_SIN_COLOR.test(etapa)&&skill!=='color';
  if(!sinColor){if(a.msat<.06)M.push('La imagen es casi monocromática: lo que opino de color es provisional.');
    if(I&&a.msat>=.08&&Math.abs(I.T.v)>=.4&&Math.abs(a.warm)>=.2){if(Math.sign(I.T.v)!==Math.sign(a.warm))P.push(`Tu imagen es ${a.warm>0?'cálida':'fría'} y tu mood es ${polo('T',I.T.v)}${evid(I.T)}.`);else F.push(`La temperatura (${a.warm>0?'cálida':'fría'}) corresponde a tu mood.`)}
    if(p&&(p.mood.paleta||[]).length){const pal=p.mood.paleta.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]),fuera=a.dom.filter(x=>x.pct>.08).filter(x=>{const r=[1,3,5].map(k=>parseInt(x.hex.slice(k,k+2),16));return Math.min(...pal.map(q=>Math.hypot(q[0]-r[0],q[1]-r[1],q[2]-r[2])))>95});
      if(fuera.length)P.push(`Colores grandes fuera de tu paleta: ${fuera.map(x=>x.hex+' ('+pct(x.pct)+')').join(', ')}. ¿Decisión nueva o deriva?`);else F.push('Los colores dominantes están dentro de tu paleta.')}
    if(a.acento){const dist=Math.hypot(a.acento.x-a.foco.x,a.acento.y-a.foco.y);if(dist>.3)P.push(`El color más saturado está ${zona2(a.acento)} y tu foco de valor ${a.foco.zona}: el acento compite con el foco. Llévalo al mismo lugar.`);else F.push('El acento de color coincide con el foco.');if(a.acento.pct>.2)P.push(`Hay mucha saturación (${pct(a.acento.pct)} de la imagen): el acento deja de ser acento.`)}}
  else M.push(`En etapa ${etapa} no juzgo color: primero valor, silueta y composición.`);
  /* proyecto: lo que se pregunta, no se adivina */
  if(p){if(!(p.que?.funcion||'').trim())M.push('NO DEFINIDA la función del diseño: sin ella no puedo decirte si la forma se justifica.');else Q.push(`Mira la vista SILUETA: ¿se entiende su función («${corto(p.que.funcion,60)}») sin detalles?`);
    p.pilares.filter(x=>x.t).forEach(x=>Q.push(`¿Se ve «${x.t}»?${x.como?' Debería verse: '+corto(x.como,80):' (NO DEFINIDO cómo se ve)'}${x.no?' · Y no debería: '+corto(x.no,60):''}`));
    const sil=p.forma?.silueta||p.lenguaje?.silueta;if(sil)Q.push(`¿Se reconoce lo que definiste para la silueta: «${corto(sil,70)}»?`);
    if((p.lenguaje?.formas||[]).length)Q.push(`¿Dominan las formas ${p.lenguaje.formas.join(', ').toLowerCase()} en la vista BORROSA?`);
    (p.evitar||[]).slice(0,2).forEach(e=>Q.push(`¿Se coló algo de tu lista de EVITAR: «${e}»?`));
    if(!p.pilares.some(x=>x.t))M.push('NO DEFINIDA la Art Direction: no puedo revisar si la imagen cumple tus pilares.')}
  if(nota)Q.unshift(`Pediste revisar: «${nota}». Compáralo con las vistas de abajo antes de corregir.`);
  /* experimentos */
  const E=[];if(P.some(x=>/Silueta|figura ocupa|Figura y fondo/.test(x)))E.push('Pinta encima de la vista SILUETA: corrige el contorno en negro puro hasta que se lea, luego regresa al detalle.');
  if(P.some(x=>/grupos de valor|Contraste|clave/.test(x)))E.push('Sobre la vista de 3 VALORES: une las zonas medias con la sombra (o con la luz) hasta que un grupo tenga ~60%. Compara.');
  if(P.some(x=>/focos compiten|detalle está repartido|borde/.test(x)))E.push('Duplica la capa y borra el 50% del detalle fuera del foco. Si la imagen mejora, el detalle sobraba.');
  if(P.some(x=>/acento|paleta|temperatura|cálida|fría|saturación/.test(x)))E.push('3 versiones de color de 5 minutos sobre el mismo gris: dominante + un solo acento en el foco.');
  E.push('Mira la vista ESPEJO: todo lo que se vea torcido o raro es un error de proporción o de balance que tu ojo ya normalizó.','Miniatura a 5 cm (vista MINI): si no sabes qué es en 2 segundos, el problema es de diseño, no de render.');
  if(skill==='atmosfera'||skill==='profundidad'){const [t,,b]=a.bandas||[];if(t&&b){if(t.sd<b.sd*.8)F.push(`Los planos lejanos (arriba) tienen menos contraste que los cercanos (${t.sd.toFixed(2)} contra ${b.sd.toFixed(2)}): la profundidad se lee.`);else P.push(`El fondo tiene tanto contraste como el primer plano (${t.sd.toFixed(2)} contra ${b.sd.toFixed(2)}): aplana la profundidad. Baja el contraste de lo lejano y acércalo al valor del cielo.`);
    if(Math.abs(t.m-b.m)<.08)P.push('Arriba y abajo tienen casi el mismo valor: separa los planos con valor, no solo con línea.')}}
  if(skill==='claves'){const cl=a.mean<.38?'baja':a.mean>.62?'alta':'media';(mx>=.55?F:P).push(`Clave ${cl}: ${mx>=.55?'un grupo de valor manda, la clave se lee.':'ningún valor manda; una clave necesita ~60% de un solo grupo.'}`)}
  if(skill==='escala')Q.unshift('¿Hay un elemento de escala conocida (figura humana, puerta, escalón, árbol)? Sin él, lo monumental se ve chico.');
  if(skill==='blockout'){if(a.detalle>.6)F.push('Masas simples con el detalle concentrado: buen blockout.');else P.push('El detalle está muy repartido para un blockout: en esta etapa solo cuentan masas, cámara y luz.')}
  if(skill)E.unshift(EJ_SKILL[skill]||'');
  return {funciona:F,problemas:P,cuestionar:Q.slice(0,6),falta:M,experimentos:[...new Set(E.filter(Boolean))].slice(0,3)};
}

function vivoFuncion(p){const f=(p.que?.funcion||'').trim();if(!f)return '<p class="nd-box"><b>NO DEFINIDO.</b> Sin función, cada decisión de forma es gusto. Empieza aquí.</p>';

function vAD(p){

    ${tx('ad',p.ad,'Que el poder se sienta sagrado y condenado a la vez: el dios sabe que su arma lo va a devorar.','f-ad',64)}<div data-vivo="ad">${vivoAD(p)}</div></div>
  <div class="pilares3">${p.pilares.map((x,i)=>`<div class="box pil"><span class="num">PILAR ${i+1}</span>
    <input type="text" id="x-pil-t-${i}" class="pil-t" data-b="pilares.${i}.t" value="${esc(x.t)}" placeholder="Nombre (una intención)">

    <div class="field"><label for="x-pil-c-${i}">Cómo se verá en el diseño</label>${tx(`pilares.${i}.como`,x.como,'Materiales desgastados, composición elegante, estructuras rotas…',`x-pil-c-${i}`,50)}</div>
    <div class="field"><label for="x-pil-n-${i}">Qué NO debe hacer</label>${tx(`pilares.${i}.no`,x.no,'No convertir todo en ruinas sin intención.',`x-pil-n-${i}`,40)}</div>
    <div class="field"><label for="x-pil-e-${i}">Elementos visuales asociados</label>${inp(`pilares.${i}.el`,x.el,'pátina, grietas doradas, simetría rota',`x-pil-e-${i}`)}</div>
    ${x.t?porqueBtn('el pilar «'+x.t+'»'):''}</div>`).join('')}</div>
  <div class="grid2"><div class="box"><h3>Debe aparecer</h3><p class="hint">Elementos obligatorios del proyecto (lore, cliente, historia).</p>
    <div class="chips">${(p.debe||[]).map((e,i)=>`<span class="chip">${esc(e)}<button data-act="debe-del" data-i="${i}" aria-label="Quitar">×</button></span>`).join('')}</div><input type="text" id="debe-t" placeholder="Elemento + Enter" data-enter="debe-add"></div>
    <div class="box"><h3>Debe evitarse</h3><p class="hint">Clichés, lecturas equivocadas, elementos descartados.</p>
    <div class="chips">${(p.evitar||[]).map((e,i)=>`<span class="chip">${esc(e)}<button data-act="evitar-del" data-i="${i}" aria-label="Quitar">×</button></span>`).join('')}</div><input type="text" id="evitar-t" placeholder="Algo que NO quieres + Enter" data-enter="evitar-add"></div></div>
  ${tallerHTML(p)}
  ${asesor('direccion','Asesor Claude: revisa mi dirección','Revisa si tus pilares son claros y distintos, y si el mood y la técnica los sostienen.')}`}
function vivoAD(p){const a=(p.ad||'').trim();if(!a)return '<p class="nd-box"><b>NO DEFINIDO.</b> Sin esta frase no hay contra qué medir nada.</p>';const O=[];
  if(a.length<25)O.push('Muy corta: todavía no dice qué se entiende Y qué se siente.');if(genericidad(a)>=.25)O.push('Usa adjetivos genéricos: cámbialos por lo específico de este proyecto.');
  const v=vecDe(a),ejes=Object.keys(AXN).filter(k=>v[k].n);if(!ejes.length)O.push('No encuentro ninguna cualidad visual o emocional en la frase: ¿qué se siente?');
  if(!/(pero|aunque|mientras|y a la vez|sin embargo|contra|entre|porque)/.test(nz(a)))O.push('No hay conflicto en la frase: una buena AD suele tener un «pero» o un «porque».');
  return O.length?`<p class="nd-box">${O.map(esc).join(' ')}</p>`:`<p class="ok-box">✓ Frase con intención: ${ejes.slice(0,3).map(k=>polo(k,v[k].v)).join(', ')}.</p>`}
function vivoPilar(p,i){const x=p.pilares[i];if(!x.t.trim())return '';const O=[];
  if(pilarObjeto(x.t))O.push(`«${x.t}» es un objeto, no una intención. ¿Qué significa ese objeto aquí? Ejemplo: «Lo sagrado pesa», no «corona».`);
  else if(genericidad(x.t)>=.34)O.push('Nombre genérico: podría ser el pilar de cualquier proyecto.');
  p.pilares.forEach((y,j)=>{if(j!==i&&y.t&&nz(y.t)===nz(x.t))O.push(`Igual al pilar ${j+1}.`)});
  return O.length?`<p class="nd-box sm">${O.map(esc).join(' ')}</p>`:'<p class="ok-box sm">✓ Es una intención.</p>'}

/* ---------- TENSIÓN ---------- */
function vTension(p){const T=p.tensiones||[],c=p.concepto;

      <div class="field"><label for="x-t-bv-${i}">¿Cómo se ve ${esc(t.b||'B')}?</label>${inp(`tensiones.${i}.bVis`,t.bVis,'rígido, frío, metálico, modular',`x-t-bv-${i}`)}</div></div>

  <div class="box"><h3>${T.length?'Otra tensión':'Agrega la tensión principal'}</h3><div class="chips">${TENS_EJ.map(([a,b])=>`<button class="ch" data-act="tens-add" data-v="${a}|${b}">${a} ↔ ${b}</button>`).join('')}
    ${c.nucleos.filter(Boolean).length>=2?`<button class="ch on" data-act="tens-add" data-v="${esc(c.nucleos[0])}|${esc(c.nucleos[1])}">${esc(c.nucleos[0])} ↔ ${esc(c.nucleos[1])} (tus núcleos)</button>`:''}<button class="ch" data-act="tens-add" data-v="|">＋ En blanco</button></div></div>
  <div class="grid2">
    <div class="box"><h3>Empújala más</h3><p class="hint">Contesta la provocación. Si sale algo que vale la pena, guárdalo.</p>
      <div class="provo">${esc(PROVOCACIONES[S.provo%PROVOCACIONES.length])}</div>
      <input type="text" id="f-empuje" placeholder="Tu respuesta… (Enter para guardar)" data-enter="empuje">
      <div class="prow"><button class="btn sm" data-act="provo">Otra provocación</button><button class="btn sm" data-act="empuje">Guardar empuje</button></div></div>
    <div class="box"><h3>Empujes guardados <span class="lbl">${c.empujes.length}</span></h3>
      ${c.empujes.length?`<ul class="list">${c.empujes.map((e,i)=>`<li><span>${esc(e)}</span><button class="btn ghost sm" data-act="del-empuje" data-i="${i}" aria-label="Quitar">✕</button></li>`).join('')}</ul>`:'<p class="muted">Aún no hay empujes.</p>'}</div></div>
  <details class="box"><summary><h3 style="display:inline">Tipo de relación (método del asesor)</h3></summary><div class="tensions">${TENSIONES.map(([t,d])=>`<button class="tens" data-act="tension" data-v="${esc(t)}" aria-pressed="${c.tension===t}"><b>${t}</b><small>${d}</small></button>`).join('')}</div>
    <div class="field"><label for="f-concepto-tensionTexto">¿Qué está en juego?</label>${ta('concepto.tensionTexto',c.tensionTexto,'Qué se pierde, quién gana…')}</div></details>`}
function vivoTension(p,i){const t=(p.tensiones||[])[i];if(!t||!t.a||!t.b)return '';const va=vecDe([t.a,t.aVis]),vb=vecDe([t.b,t.bVis]),V=vecDe(visTextos(p));
  const ejes=Object.keys(AXN).map(a=>[a,Math.abs(va[a].v-vb[a].v)]).filter(x=>x[1]>=.6).sort((x,y)=>y[1]-x[1]);
  if(!ejes.length)return `<p class="nd-box sm">No sé cómo se ven «${esc(t.a)}» y «${esc(t.b)}» todavía. Escribe arriba 3 adjetivos visuales para cada uno y te propongo decisiones.</p>`;
  const sug=ejes.slice(0,3).map(([a])=>`Usar ${visDe(a,va[a].v)} para «${t.a}», y ${visDe(a,vb[a].v)} para «${t.b}».`);
  const extra=['Diseña el punto de contacto: donde A toca a B es donde vive la historia.',t.domina?`${t.domina.replace('A',t.a).replace(/B/,t.b)}: que se note en la proporción de la imagen (~70/30).`:'Decide quién domina: un 50/50 no toma partido.','Silueta = una idea, detalle = la otra.'];
  const falta=ejes.filter(([a])=>Math.abs(V[a].v)<.3);
  return `<div class="sug"><span class="lbl">Posibles decisiones visuales (eliges tú)</span><ul>${[...sug,...extra].map(s=>`<li>${esc(s)} <button class="btn ghost sm" data-act="regla-add" data-v="${esc(s)}">＋ regla</button></li>`).join('')}</ul>
    ${falta.length?`<p class="muted">Tu lenguaje visual todavía no muestra el eje ${falta.map(([a])=>AXN[a].join('/')).join(', ')}.</p>`:''}</div>`}

/* ---------- MOOD ---------- */

    <div class="box"><h3>Luz</h3><p class="hint">¿Cómo está iluminado?</p>${tx('mood.luz',m.luz,'Una sola fuente: fuego bajo desde abajo; el resto se pierde',null,50)}</div>
    <div class="box"><h3>Clima</h3><p class="hint">¿Qué condiciones ambientales existen?</p>${tx('mood.clima',m.clima,'Humedad, humo, ceniza suspendida',null,50)}</div>
  </div>
  <div class="box"><h3>Color · relación cromática</h3>${chSel('mood.rel',MOOD_REL,m.rel,false)}${tx('mood.color',m.color,'Carmesí contra negro obsidiana; oro como acento',null,44)}</div>
  <div class="box"><h3>3 palabras de mood</h3><div class="tres">${[0,1,2].map(i=>`<input type="text" id="x-mood-tres-${i}" data-b="mood.tres.${i}" value="${esc(t[i]||'')}" placeholder="${['solemne','húmedo','inevitable'][i]}">`).join('')}</div>

function vivoSintesis(p){const t=tresMood(p).filter(Boolean);if(t.length<3)return `<p class="nd-box sm">El proyecto debe sentirse: ${t.map(esc).join(', ')||'___'}${t.length<3?', ___':''}. (Faltan ${3-t.length})</p>`;

function vivoPalSug(p){const s=paletaSugerida(p);
  return `<h3>Paleta guiada por tu mood</h3><p class="hint">Cambia en vivo con lo que escribes. Es una propuesta: tú decides.</p>

    <div class="palrol">${s.pal.map(c=>`<span><i style="background:${c.hex}"></i>${esc(c.rol)} <small>${c.pct}%</small></span>`).join('')}</div>
    <ul class="why-l">${s.razones.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><div class="prow"><button class="btn sm pri" data-act="pal-usar">Usar esta paleta</button></div>`}
function vivoPalCheck(p){const pl=paletaLectura(p.mood.paleta||[]);if(!pl)return '';const M=vecDe(moodTextos(p)),O=[];
  if(Math.abs(M.T.v)>=.4&&Math.abs(pl.temp)>=.25)O.push(Math.sign(M.T.v)===Math.sign(pl.temp)?`✓ Temperatura ${pl.temp>0?'cálida':'fría'}, como tu mood.`:`✗ Tu paleta es ${pl.temp>0?'cálida':'fría'} y tu mood es ${polo('T',M.T.v)}${evid(M.T)}.`);
  if(Math.abs(M.V.v)>=.4)O.push((M.V.v<0&&pl.luz<.45)||(M.V.v>0&&pl.luz>.5)?'✓ El valor de la paleta acompaña al mood.':`✗ El mood pide ${polo('V',M.V.v)} y tu paleta promedia ${Math.round(pl.luz*100)}% de luz.`);
  if(M.E.v<=-.4&&pl.sat>.6)O.push('✗ Saturación alta para un mood en calma.');
  return O.length?`<ul class="why-l">${O.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:'<p class="muted">Escribe emoción, luz o 3 palabras y comparo tu paleta contra ellas.</p>'}

  return `

  if(!r||r.k!==hoyKey())return `<div class="prow"><button class="btn sm pri" data-act="d-analizar">Feedback de mi ejercicio</button><span class="muted">Mide tu resultado según ${esc(SKILLS[e.skill])}.</span></div>`;
  return analisisHTML(r.a,r.cr,{id:'d',skill:e.skill,guardar:r.guardado?'<span class="ok-box sm">✓ Guardado en tu día</span>':'<button class="btn sm" data-act="d-fb-guardar">Guardar feedback en mi día</button>'})}

/* ---------- ESTOY BLOQUEADO / ¿POR QUÉ? (overlays) ---------- */
function abrirBloqueado(){const p=S.P[S.cur];if(!p)return;const f=S.blk||{que:queDe(p),tengo:'',nofunciona:'',evitar:(p.evitar||[]).join(', ')};S.blk=f;
  const r=S.blkR;$('#overlay').innerHTML=`<div class="modal" role="dialog" aria-label="Estoy bloqueado"><div class="modal-b"><div class="prow" style="justify-content:space-between"><h3>Estoy bloqueado</h3><button class="btn ghost sm" data-act="modal-x">Cerrar</button></div>
    ${[['que','¿Qué estás intentando diseñar?'],['tengo','¿Qué ya tienes?'],['nofunciona','¿Qué no funciona?'],['evitar','¿Qué quieres evitar?']].map(([k,l])=>`<div class="field"><label for="blk-${k}">${l}</label><textarea id="blk-${k}" data-blk="${k}" style="min-height:44px">${esc(f[k]||'')}</textarea></div>`).join('')}
    <div class="prow"><button class="btn pri" data-act="blk-go">Ayúdame a pensar</button></div>
    ${r?`<div class="an-txt"><div class="an-sec ok"><h4>Definido</h4><p>${esc(r.definido.join(', ')||'casi nada')}</p></div>
      ${r.falta.length?`<div class="an-sec q"><h4>Falta</h4><p>${esc(r.falta.slice(0,6).join(' · '))}</p></div>`:''}
      ${r.contra.length?`<div class="an-sec no"><h4>Contradicciones</h4><ul>${r.contra.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${r.abiertos.length?`<div class="an-sec q"><h4>Demasiado abierto</h4><ul>${r.abiertos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      <div class="an-sec q"><h4>3 preguntas</h4><ol>${r.preguntas.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
      <div class="an-sec exp"><h4>3 experimentos</h4><ol>${r.experimentos.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
      <div class="an-sec op"><h4>3 direcciones posibles</h4><ol>${r.direcciones.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
      <div class="prow">${r.guardado?'<span class="ok-box sm">✓ Guardado</span>':'<button class="btn sm" data-act="blk-save">Guardar (preguntas → abiertas, evitar → lista)</button>'}</div></div>`:''}</div></div>`}
function abrirWhy(){const w=S.why;if(!w)return;const sig=porqueSig(w.tema,w.chain);
  $('#overlay').innerHTML=`<div class="modal" role="dialog" aria-label="¿Por qué?"><div class="modal-b"><div class="prow" style="justify-content:space-between"><h3>¿Por qué ${esc(w.tema)}?</h3><button class="btn ghost sm" data-act="modal-x">Cerrar</button></div>
    <p class="hint">De «se ve cool» a «responde a la función, el contexto y la narrativa». Contesta corto y honesto.</p>
    <ol class="whyc">${w.chain.map(c=>`<li><span class="muted">${esc(c.q)}</span><br><b>${esc(c.a)}</b></li>`).join('')}</ol>
    ${sig&&!w.fin?`<div class="field"><label for="why-a">${esc(sig)}</label><textarea id="why-a" data-enter="why-next" style="min-height:48px"></textarea></div><div class="prow"><button class="btn pri" data-act="why-next">Responder</button>${w.chain.length>=2?'<button class="btn ghost" data-act="why-fin">Ya es suficiente</button>':''}</div>`
      :`<p class="ok-box">${esc(porqueCierre(w.tema,w.chain))}</p><div class="prow"><button class="btn pri" data-act="why-save">${w.dec?'Guardar en la decisión':'Guardar como decisión'}</button></div>`}</div></div>`;setTimeout(()=>$('#why-a')?.focus(),0)}

/* ---------- exportar / duplicar ---------- */
async function descargar(nombre,texto,tipo){if(S.downloads){try{await S.downloads.save({filename:nombre,data:texto});toast('Descargado: '+nombre);return}catch(e){if(e?.code==='declined')return}}
  try{const u=URL.createObjectURL(new Blob([texto],{type:tipo||'text/plain'})),a=document.createElement('a');a.href=u;a.download=nombre;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Descargado: '+nombre)}catch{toast('No se pudo descargar')}}
function duplicarProyecto(p,extra){const id=uid(),np=normaliza(clone(p));np.nombre=p.nombre+(extra?.sufijo||' · dirección B');np.creado=np.actualizado=Date.now();np.origen={id:S.cur,nombre:p.nombre};np.chat=[];np.chatPend=null;
  np.piezas=[];np.criticas=[];if(extra?.nota)np.notas=[extra.nota,np.notas].filter(Boolean).join('\n\n');if(extra?.estil)np.guia.estilizacion=extra.estil;S.P[id]=np;S.cur=id;S.tab='cerebro';recordar();marcar();render();toast('Proyecto duplicado: explora sin miedo, el original no cambia')}

/* ---------- actualización en vivo (sin re-render, no pierde el foco) ---------- */
const VIVO={funcion:p=>vivoFuncion(p),ad:p=>vivoAD(p),pil:(p,i)=>vivoPilar(p,i),tens:(p,i)=>vivoTension(p,i),sintesis:p=>vivoSintesis(p),palsug:p=>vivoPalSug(p),palcheck:p=>vivoPalCheck(p)};
function dxVivo(p){document.querySelectorAll('[data-vivo]').forEach(el=>{const f=VIVO[el.dataset.vivo];if(f)try{el.innerHTML=f(p,+el.dataset.i)}catch{}})}

/* ---------- acciones del cerebro ---------- */
function chatEnviar(p,txt){txt=String(txt||'').trim();if(!txt)return;p.chat=p.chat||[];p.chat.push({r:'yo',t:txt,ts:Date.now()});
  let r;try{r=responder(p,txt)}catch(e){console.error(e);r={t:'Algo falló al leer tu proyecto. Intenta decirlo de otra forma.',acc:[]}}
  p.chat.push({r:'dir',t:r.t,acc:r.acc,ts:Date.now()});if(p.chat.length>80)p.chat=p.chat.slice(-80);marcar();renderMain();
  const lg=$('#chat-log');if(lg)lg.scrollTop=lg.scrollHeight;$('#chat-txt')?.focus()}
async function accionDir(a,el,p,ds){
  switch(a){
    case 'dx-chip':{if(!p)return;const arr=getPath(p,ds.path)||[];const i=arr.indexOf(ds.v);if(i>=0)arr.splice(i,1);else arr.push(ds.v);setPath(p,ds.path,arr);marcar();renderMain();break}
    case 'dx-one':{if(!p)return;setPath(p,ds.path,getPath(p,ds.path)===ds.v?'':ds.v);marcar();renderMain();break}
    case 'etapa':p.etapa=ds.v;S.tab=ds.tab;marcar();renderMain();window.scrollTo({top:0});break;
    case 'chat':chatEnviar(p,$('#chat-txt')?.value);break;
    case 'chat-sug':chatEnviar(p,ds.v);break;
    case 'chat-elem':chatEnviar(p,'Quiero que tenga '+ds.v);break;
    case 'chat-limpiar':if(!S.confirmChat){S.confirmChat=true;renderMain();return}S.confirmChat=false;p.chat=[];p.chatPend=null;marcar();renderMain();break;
    case 'chat-acc':{const m=p.chat?.[+ds.m],x=m?.acc?.[+ds.i];if(!x)return;
      if(x.tipo==='resp'){chatEnviar(p,x.v);return}
      if(x.tipo==='tab'){S.tab=x.v;renderMain();window.scrollTo({top:0});return}
      if(x.tipo==='blk'){S.blkR=null;abrirBloqueado();return}
      if(x.tipo==='why-dec'){const d=(p.decisiones||[]).find(z=>z.id===x.v);if(d){S.why={tema:d.t,chain:[],dec:d.id};abrirWhy()}return}
      if(x.tipo==='undo-dec'){const d=(p.decisiones||[]).find(z=>z.id===x.v);p.decisiones=(p.decisiones||[]).filter(z=>z.id!==x.v);if(d){const k=nz(d.t.split(' = ')[0]);p.elementos=(p.elementos||[]).filter(e=>nz(e.k)!==k)}p.chatPend=null}
      if(x.tipo==='regla'){p.lenguaje.reglas=p.lenguaje.reglas||[];if(!p.lenguaje.reglas.includes(x.v))p.lenguaje.reglas.push(x.v)}
      if(x.tipo==='bq-gen'){try{const b=JSON.parse(x.v);if(!p.busquedas.some(z=>z.q===b.q))p.busquedas.push(b)}catch{}}
      if(x.tipo==='tens-add'){const [A,B]=x.v.split('|');p.tensiones.push({a:A,b:B,aVis:'',bVis:'',como:'',domina:''})}
      if(x.tipo==='dec-txt')nuevaDecision(p,x.v,'',[],'asistente','En prueba');
      if(x.tipo==='preg-txt')p.preguntas.push({id:uid(),t:x.v,ts:Date.now()});
      if(x.tipo==='nota-txt')p.notas=[p.notas,x.v].filter(Boolean).join('\n');
      x.hecho=true;marcar();renderMain();toast(x.tipo==='undo-dec'?'Deshecho':'Guardado');break}
    case 'audit-save':{const D=DX(p);p.criticas.push({tipo:'Auditoría',ts:Date.now(),r:{Conflictos:D.conflictos.map(c=>c.t+' → '+c.fix),Vacíos:D.vacios.map(v=>v.n+': '+v.q),Genéricos:D.genericos,Fortalezas:D.fortalezas,Oportunidades:D.oportunidades,Preguntas:D.preguntas.map(q=>q.t)}});marcar();toast('Auditoría guardada en Crítica → historial');break}
    case 'preg-add':{const v=$('#preg-t')?.value.trim();if(!v)return;p.preguntas.push({id:uid(),t:v,ts:Date.now()});marcar();renderMain();$('#preg-t')?.focus();break}
    case 'preg-ok':{const q=p.preguntas.find(x=>x.id===ds.id);if(q){q.ok=!q.ok;marcar();renderMain()}break}
    case 'preg-del':p.preguntas=p.preguntas.filter(x=>x.id!==ds.id);marcar();renderMain();break;
    case 'evitar-add':{const v=$('#evitar-t')?.value.trim();if(!v)return;v.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!p.evitar.includes(x))p.evitar.push(x)});marcar();renderMain();$('#evitar-t')?.focus();break}
    case 'evitar-del':p.evitar.splice(+ds.i,1);marcar();renderMain();break;
    case 'debe-add':{const v=$('#debe-t')?.value.trim();if(!v)return;v.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!p.debe.includes(x))p.debe.push(x)});marcar();renderMain();$('#debe-t')?.focus();break}
    case 'debe-del':p.debe.splice(+ds.i,1);marcar();renderMain();break;
    case 'dec-add':{const t=$('#dec-t')?.value.trim();if(!t)return;nuevaDecision(p,t,$('#dec-m')?.value.trim(),[],'manual');marcar();renderMain();$('#dec-t')?.focus();break}
    case 'dec-del':{const k='d'+ds.id;if(S.confirmLi!==k){S.confirmLi=k;renderMain();return}S.confirmLi=null;p.decisiones=p.decisiones.filter(d=>d.id!==ds.id);marcar();renderMain();break}
    case 'why':S.why={tema:ds.tema,chain:[],dec:ds.dec||null};if(ds.dec){const d=p.decisiones.find(z=>z.id===ds.dec);if(d?.porque?.length)S.why.chain=[]}abrirWhy();break;
    case 'why-next':{const v=$('#why-a')?.value.trim();if(!v||!S.why)return;S.why.chain.push({q:porqueSig(S.why.tema,S.why.chain),a:v});if(!porqueSig(S.why.tema,S.why.chain))S.why.fin=true;abrirWhy();break}
    case 'why-fin':S.why.fin=true;abrirWhy();break;
    case 'why-save':{const w=S.why;if(!w||!p)return;const cierre=porqueCierre(w.tema,w.chain);let d=w.dec&&p.decisiones.find(z=>z.id===w.dec);
      if(!d)d=nuevaDecision(p,cap(w.tema.replace(/^(este material|el pilar)\W*/,'')),w.chain.map(c=>c.a).at(-1)||'',[],'porque');
      d.porque=w.chain;d.cierre=cierre;const sust=w.chain.map(c=>c.a).filter(a=>!/cool|bonit|me gusta|se ve bien|chid|padre/.test(nz(a)));if(!d.motivo||d.fuente==='porque')d.motivo=sust.join(' → ');S.why=null;$('#overlay').innerHTML='';marcar();renderMain();toast('Guardado en el Decision log');break}
    case 'modal-x':S.why=null;$('#overlay').innerHTML='';break;
    case 'blk':S.blk=null;S.blkR=null;abrirBloqueado();break;
    case 'blk-go':S.blkR=desbloqueo(p,S.blk||{});abrirBloqueado();break;
    case 'blk-save':{const r=S.blkR;if(!r)return;r.preguntas.forEach(t=>p.preguntas.push({id:uid(),t,ts:Date.now()}));
      (S.blk?.evitar||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!p.evitar.includes(x))p.evitar.push(x)});
      p.criticas.push({tipo:'Desbloqueo',ts:Date.now(),titulo:S.blk?.nofunciona||'',r:{Preguntas:r.preguntas,Experimentos:r.experimentos,Direcciones:r.direcciones,Contradicciones:r.contra}});r.guardado=true;marcar();abrirBloqueado();renderMain();break}
    case 'tens-add':{const [A,B]=(ds.v||'|').split('|');p.tensiones.push({a:A||'',b:B||'',aVis:'',bVis:'',como:'',domina:''});marcar();renderMain();break}
    case 'tens-del':{const k='t'+ds.i;if(S.confirmLi!==k){S.confirmLi=k;el.textContent='¿Quitar?';return}S.confirmLi=null;p.tensiones.splice(+ds.i,1);marcar();renderMain();break}
    case 'regla-add':{const v=ds.v;if(!v)return;p.lenguaje.reglas=p.lenguaje.reglas||[];if(!p.lenguaje.reglas.includes(v))p.lenguaje.reglas.push(v);marcar();el.textContent='✓';el.disabled=true;if(S.tab==='lenguaje')renderMain();break}
    case 'regla-add-t':{const v=$('#regla-t')?.value.trim();if(!v)return;p.lenguaje.reglas.push(v);marcar();renderMain();$('#regla-t')?.focus();break}
    case 'regla-del':p.lenguaje.reglas.splice(+ds.i,1);marcar();renderMain();break;
    case 'pal-usar':{p.mood.paleta=paletaSugerida(p).pal.map(c=>c.hex);p.mood.paletaPropia=true;marcar();renderMain();toast('Paleta aplicada: ajústala a tu gusto');break}
    case 'bq-obj':S.bqObj=ds.v;renderMain();break;
    case 'bq-gen-i':{const b=busquedasGen(p,S.bqObj||'Forma')[+ds.i];if(!b)return;if(!p.busquedas.some(z=>z.q===b.q))p.busquedas.push(b);marcar();el.textContent='✓ Guardada';el.disabled=true;break}
    case 'ref-set':{const r=p.refs.find(x=>x.id===ds.id);if(!r)return;r[ds.k]=r[ds.k]===ds.v?'':ds.v;if(ds.k==='tipoRef')r.clase='';marcar();renderMain();break}
    case 'ref-tog':{const r=p.refs.find(x=>x.id===ds.id);if(!r)return;const arr=r[ds.k]=r[ds.k]||[],i=arr.indexOf(ds.v);if(i>=0)arr.splice(i,1);else arr.push(ds.v);marcar();renderMain();break}
    case 'ref-dec':{const r=p.refs.find(x=>x.id===ds.id);if(!r)return;if(!(r.cambio||'').trim()){toast('Primero escribe qué cambiarás en tu diseño');$('#rd-'+r.id)?.focus();return}
      const d=nuevaDecision(p,r.cambio.trim(),r.aprendo||r.porque||'',[...(r.estudio||[]).filter(c=>DEC_REL.includes(c)),'Referencia'],'referencia');r.decId=d.id;marcar();renderMain();toast('Referencia → decisión guardada');break}
    case 'var-explorar':{const v=variantes(p).find(x=>x.k===ds.k);if(!v)return;p.exploraciones.push({ts:Date.now(),titulo:`Dirección ${v.k}: ${v.n}`,detalle:Object.entries(v.c).map(([k,x])=>k+': '+x).join(' · '),nota:''});marcar();renderMain();toast('Guardada en Exploraciones');break}
    case 'var-dup':{const v=variantes(p).find(x=>x.k===ds.k);if(!v)return;duplicarProyecto(p,{sufijo:` · ${v.k} ${v.n.split(' · ')[0]}`,nota:`Dirección ${v.k} (${v.n}):\n`+Object.entries(v.c).map(([k,x])=>`- ${k}: ${x}`).join('\n'),estil:v.n});break}
    case 'az-lock':{S.dxLocks=S.dxLocks||{};S.dxLocks[ds.k]=S.dxLocks[ds.k]===ds.v?'':ds.v;renderMain();break}
    case 'azar':azar(p,S.dxLocks||{});renderMain();break;
    case 'azar-si':{const c=S.dxAzar;if(!c)return;p.exploraciones.push({ts:Date.now(),titulo:`${cap(c.mat)} + ${c.forma} + ${c.func} + ${c.mood}`,detalle:c.lectura+' '+c.preguntas.join(' '),nota:''});marcar();renderMain();toast('Dirección guardada para explorar');break}
    case 'ex-del':p.exploraciones.splice(+ds.i,1);marcar();renderMain();break;
    case 'darl':{p.darlings=p.darlings||{};const k=nz(ds.k);p.darlings[k]=p.darlings[k]===ds.v?'':ds.v;
      if(ds.v==='Eliminar'&&p.darlings[k]&&!p.evitar.includes(ds.k))p.evitar.push(ds.k+' (descartado)');
      if(p.darlings[k]&&ds.v!=='Se queda')nuevaDecision(p,`${cap(ds.k)}: ${ds.v.toLowerCase()}`,'Kill your darlings',['Forma'],'darlings',ds.v==='Eliminar'?'Descartada':'Confirmada');
      marcar();renderMain();break}
    case 'an-vista':S.anVista=S.anVista||{};S.anVista[ds.id]=ds.v;renderMain();break;
    case 'an-guardar':{const an=S.anP?.[S.cur];if(!an)return;
      p.criticas.push({tipo:`Boceto · ${an.etapa||'Boceto'}`,ts:Date.now(),titulo:an.nota||'',img:an.a.vistas.mini,r:{'Lo que funciona':an.cr.funciona,'Problemas reales':an.cr.problemas,'Decisiones que cuestionaría':an.cr.cuestionar,'Información que falta':an.cr.falta,'Experimentos':an.cr.experimentos}});
      if(an.file&&!an.pieza){try{const pz={id:uid(),etapa:an.etapa||'Boceto',nota:an.nota||'',creado:Date.now(),analisis:{ts:Date.now(),...an.cr},...await guardarImagen(an.file)};p.piezas.push(pz);an.pieza=pz}catch{toast('La crítica se guardó; la imagen no se pudo subir')}}
      an.guardada=true;marcar();renderMain();toast('Crítica guardada');break}
    case 'cc':{const t=$('#cc-txt')?.value.trim();if(!t){toast('Describe tu diseño primero');return}S.ccTxt=t;S.ccRes=S.ccRes||{};S.ccRes[S.cur]=criticaConcepto(p,t);renderMain();break}
    case 'cc-guardar':{const c=S.ccRes?.[S.cur];if(!c)return;p.criticas.push({tipo:'Concepto escrito',ts:Date.now(),titulo:S.ccTxt||'',r:{'Lo que funciona':c.funciona,'Lo que no está claro':c.noClaro,'Lo que parece genérico':c.generico,'Qué cuestionaría':c.cuestionar,'Qué explorar':c.explorar}});c.guardada=true;marcar();renderMain();break}
    case 'crit-del':{const k='c'+ds.i;if(S.confirmLi!==k){S.confirmLi=k;el.textContent='¿Seguro?';return}S.confirmLi=null;p.criticas.splice(+ds.i,1);marcar();renderMain();break}
    case 'd-analizar':{const r=S.ajustes.rutina?.dias?.[hoyKey()];if(!r?.img)return;el.disabled=true;el.textContent='Analizando…';
      try{const a=await analizarImagen(r.img),e=ejercicioDeHoy(),cr=criticaImagen(a,null,{etapa:e.skill==='color'?'Color':'Valores',skill:e.skill,nota:r.nota||''});S.anD={k:hoyKey(),a,cr};registrarMetrica(a,'diario','')}catch{toast('No pude leer la imagen')}renderMain();break}
    case 'd-fb-guardar':{const r=S.ajustes.rutina?.dias?.[hoyKey()];if(!r||!S.anD)return;r.fb={ts:Date.now(),funciona:S.anD.cr.funciona,problemas:S.anD.cr.problemas,experimentos:S.anD.cr.experimentos};S.anD.guardado=true;marcarAj();renderMain();break}
    case 'duplicar':duplicarProyecto(p);break;
    case 'ref-f':S.refF=ds.v;renderMain();break;
    case 'exp-json':descargar(slug(p.nombre,60)+'.json',JSON.stringify({...clone(p),exportado:new Date().toISOString(),app:'Potenciador de Conceptos'},null,2),'application/json');break;
  }
}

/* =====================================================================
   GENERADOR DE NOMBRES LOCAL (sin IA de pago)
   Raíces reales por idioma + reglas de composición de cada lengua.
   Lo compuesto se marca para verificar; lo que coincide con un nombre
   histórico o mitológico real se avisa.
   ===================================================================== */
/* clave | detectar | es | en | latín nom | latín gen | griego (forma de combinación) | náhuatl palabra | náhuatl raíz | japonés */
const NOMR=`guerra|guerr,batall,combat,war|Guerra|War|Bellum|belli|Polemo|yaotl|yao|Sensō
dios|dios,divin,deidad,sagrad,god|Dios|God|Deus|dei|Theo|teotl|teo|Kami
serpiente|serpient,vibora,culebra,snake,serpent|Serpiente|Serpent|Serpens|serpentis|Ophio|coatl|coa|Hebi
jaguar|jaguar,felin,ocelot|Jaguar|Jaguar|Onca|oncae|Pardalo|ocelotl|ocelo|
obsidiana|obsidian|Obsidiana|Obsidian|||Melanolitho|itztli|itz|
sangre|sangr,blood|Sangre|Blood|Sanguis|sanguinis|Haimo|eztli|ez|Chi
fuego|fuego,llama,brasa,fire,flam|Fuego|Fire|Ignis|ignis|Pyro|tletl|tle|Homura
agua|agua,water|Agua|Water|Aqua|aquae|Hydro|atl|a|Mizu

function nuevaRonda(p,titulo,notas,v1){p.rondas=p.rondas||[];const r={id:uid(),titulo:titulo||'Ronda '+(p.rondas.length+1),ts:Date.now(),v1:v1||'',v2:'',notas:(notas||[]).map(t=>({id:uid(),t:String(t),estado:'Pendiente'}))};p.rondas.unshift(r);return r}
function distPal(a,pal){const P=(pal||[]).map(h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)));if(!P.length)return null;const ds=a.dom.filter(x=>x.pct>.05).map(x=>{const r=[1,3,5].map(k=>parseInt(x.hex.slice(k,k+2),16));return Math.min(...P.map(q=>Math.hypot(q[0]-r[0],q[1]-r[1],q[2]-r[2])))});return ds.length?ds.reduce((s,v)=>s+v,0)/ds.length:null}
function comparar(a1,a2,p){const R=[],row=(n,v1,v2,mejor,fmt,umbral)=>{const d=v2-v1,est=Math.abs(d)<umbral?'igual':(mejor(d)?'mejoró':'empeoró');R.push({n,v1:fmt(v1),v2:fmt(v2),est})};
  const pct=v=>Math.round(v*100)+'%',n2=v=>v.toFixed(2);
  row('Valor dominante',Math.max(...a1.tres),Math.max(...a2.tres),d=>d>0,pct,.04);
  row('Contraste',a1.std,a2.std,d=>a1.std<.28?d>0:d<0,n2,.02);
  row('Separación figura/fondo',a1.separ,a2.separ,d=>d>0,pct,.03);
  row('Complejidad de silueta',a1.complej,a2.complej,d=>a1.complej>4?d<0:d>0,v=>v.toFixed(1),.4);
  row('Detalle en el foco',a1.detalle,a2.detalle,d=>d>0,pct,.04);
  R.push({n:'Focos que compiten',v1:a1.foco2?'sí':'no',v2:a2.foco2?'sí':'no',est:a1.foco2&&!a2.foco2?'mejoró':!a1.foco2&&a2.foco2?'empeoró':'igual'});
  const d1=distPal(a1,p?.mood.paleta),d2=distPal(a2,p?.mood.paleta);if(d1!=null&&d2!=null)row('Cercanía a tu paleta',-d1,-d2,d=>d>0,v=>Math.round(-v)+'',8);
  return R}
function rondasHTML(p){const L=p.rondas||[],pz=(p.piezas||[]).slice().reverse(),opt=(sel)=>`<option value="">—</option>${pz.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.etapa)} · ${fecha(x.creado)}${x.nota?' · '+esc(corto(x.nota,30)):''}</option>`).join('')}`;
  return `<div class="box"><div class="prow" style="justify-content:space-between"><h3>Rondas de feedback · como en dailies</h3><span class="prow"><input type="text" id="ron-t" placeholder="Nombre de la ronda (ej. Lineup v1)" style="width:220px" data-enter="ron-add"><button class="btn sm" data-act="ron-add">＋ Ronda</button></span></div>
    <p class="hint">Cada nota es una tarea: pendiente, corregida o descartada. Al subir la siguiente versión, compara v1 ↔ v2 y te dice qué mejoró de verdad.</p>
    ${L.length?L.map((r,ri)=>{const c=r.notas.filter(n=>n.estado!=='Pendiente').length;return `<details class="ronda" ${ri===0?'open':''}><summary><b>${esc(r.titulo)}</b> <span class="lbl">${c}/${r.notas.length} cerradas · ${fecha(r.ts)}</span></summary>
      <div class="bar" style="margin:6px 0"><i style="width:${r.notas.length?c/r.notas.length*100:0}%"></i></div>
      <ol class="notas">${r.notas.map((n,ni)=>`<li class="${nz(n.estado)}"><span>${esc(n.t)}</span><span class="chips">${NOTA_EST.map(e=>`<button class="ch xs ${n.estado===e?'on':''}" data-act="nota-est" data-r="${ri}" data-n="${ni}" data-v="${e}">${e}</button>`).join('')}</span></li>`).join('')}</ol>
      <div class="prow"><input type="text" id="ron-n-${ri}" placeholder="Nueva nota + Enter" data-enter="nota-add" data-r="${ri}" style="flex:1 1 220px"><button class="btn sm" data-act="nota-add" data-r="${ri}">＋</button></div>
      <div class="prow" style="align-items:flex-end"><div class="field"><label for="ron-v1-${ri}">Versión 1</label><select id="ron-v1-${ri}" data-b="rondas.${ri}.v1">${opt(r.v1)}</select></div><div class="field"><label for="ron-v2-${ri}">Versión 2</label><select id="ron-v2-${ri}" data-b="rondas.${ri}.v2">${opt(r.v2)}</select></div><button class="btn sm pri" data-act="ron-comp" data-r="${ri}">Comparar v1 ↔ v2</button>
        <button class="btn ghost sm danger" data-act="ron-del" data-r="${ri}">${S.confirmLi==='r'+r.id?'¿Borrar?':'Borrar ronda'}</button></div>
      ${S.comp?.[r.id]?compHTML(S.comp[r.id],r):''}</details>`}).join(''):'<p class="muted">Sin rondas. Crea una, o convierte los problemas de un análisis en ronda.</p>'}</div>`}
function compHTML(k,r){return `<div class="comp"><div class="comp-img"><figure><img src="${k.m1}" alt="Versión 1"><figcaption>v1</figcaption></figure><figure><img src="${k.m2}" alt="Versión 2"><figcaption>v2</figcaption></figure></div>
  <table class="comp-t"><tbody>${k.R.map(x=>`<tr class="${x.est==='mejoró'?'ok':x.est==='empeoró'?'no':''}"><td>${esc(x.n)}</td><td>${esc(x.v1)}</td><td>→</td><td>${esc(x.v2)}</td><td><b>${x.est}</b></td></tr>`).join('')}</tbody></table>
  <p class="muted">Mejoró ${k.R.filter(x=>x.est==='mejoró').length} · empeoró ${k.R.filter(x=>x.est==='empeoró').length}. Las notas de diseño (vestuario, anatomía, símbolos) no se miden en píxeles: márcalas tú arriba.</p></div>`}

/* ---------- 5 · progreso medido ---------- */
function registrarMetrica(a,fuente,pid){if(!a)return;const L=S.ajustes.metricas=S.ajustes.metricas||[],k=a.W+'x'+a.H+'-'+a.mean.toFixed(4)+'-'+a.std.toFixed(4);if(L.some(m=>m.k===k))return;
  L.push({k,ts:Date.now(),fuente,pid:pid||'',dom:+Math.max(...a.tres).toFixed(3),std:+a.std.toFixed(3),separ:+a.separ.toFixed(3),complej:+a.complej.toFixed(2),detalle:+a.detalle.toFixed(3),compite:!!a.foco2});if(L.length>300)L.splice(0,L.length-300);marcarAj()}
function spark(vals,col){if(vals.length<2)return '<span class="muted">Necesito 2+ análisis</span>';const W=260,H=60,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1,pts=vals.map((v,i)=>[6+i*(W-12)/(vals.length-1),H-6-(v-mn)/r*(H-12)]);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" aria-hidden="true"><path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col||'var(--accent)'}" stroke-width="2.5"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${col||'var(--accent)'}"/>`).join('')}</svg>`}
function progresoMedidoHTML(){const L=(S.ajustes.metricas||[]).slice().sort((a,b)=>a.ts-b.ts);
  const M=[['dom','Valor dominante','Un valor que manda (~60%): la imagen tiene clave.',v=>Math.round(v*100)+'%',1],['separ','Separación figura/fondo','Qué tan rápido se despega el sujeto.',v=>Math.round(v*100)+'%',1],['detalle','Detalle en el foco','Jerarquía: detalle concentrado donde miras.',v=>Math.round(v*100)+'%',1],['complej','Complejidad de silueta','Más bajo = lectura más limpia.',v=>v.toFixed(1),-1]];
  const tend=(k,dir)=>{if(L.length<4)return '';const h=Math.floor(L.length/2),a=L.slice(0,h).reduce((s,m)=>s+m[k],0)/h,b=L.slice(h).reduce((s,m)=>s+m[k],0)/(L.length-h),d=(b-a)*dir;return Math.abs(b-a)<.02?'estable':d>0?'↑ mejorando':'↓ bajando'};
  const comp=L.filter(m=>m.compite).length;
  return `<div class="box"><div class="prow" style="justify-content:space-between"><h3>Tu progreso medido</h3><span class="lbl">${L.length} análisis de tus imágenes</span></div>
    <p class="hint">No es una calificación de tu arte: son las mismas medidas del análisis de bocetos, en el tiempo. Se guardan solas cada vez que analizas un boceto, tu estudio diario o comparas versiones.</p>
    ${L.length?`<div class="grid2">${M.map(([k,n,d,f,dir])=>`<div class="metric"><div class="prow" style="justify-content:space-between"><b>${n}</b><span class="lbl">${f(L.at(-1)[k])} ${tend(k,dir)}</span></div>${spark(L.map(m=>m[k]))}<small class="muted">${d}</small></div>`).join('')}</div>
    <p class="muted">Focos que compiten en ${comp} de ${L.length} imágenes${L.length>=6?` (últimas 5: ${L.slice(-5).filter(m=>m.compite).length})`:''}.</p>`:'<p class="muted">Analiza un boceto en Crítica o en tu Estudio diario para empezar.</p>'}</div>`}

/* ---------- 2 + 6 · revisión de reclutador + coherencia de estilo ---------- */
const REC_TIPOS=['Environment','Keyframe','Personaje','Criatura','Prop','Ilustración','Estudio','Fan art'];
const REC_CHECK=[['nombre','Tu nombre y especialidad (Environment & Keyframe Concept Artist) arriba de todo'],['contacto','Correo visible en un clic'],['contexto','Cada proyecto tiene 1–2 frases de contexto (qué es, para qué)'],['proceso','Al menos 2 proyectos muestran proceso (thumbnails → final)'],['orden','Lo mejor primero y lo más débil fuera: mejor 10 fuertes que 25 mezcladas'],['marca','Sin marcas de agua enormes ni imágenes pixeleadas'],['serie','Al menos un proyecto es una serie coherente (mismo mundo, varios entregables)']];
async function revisarPortafolio(){S.rec={busy:true};renderMain();const items=[];
  try{const url=S.ajustes.portafolioUrl||PF_URL_DEF;const bl=await imagenesPortafolio(url);
    for(let i=0;i<bl.length;i++){try{const a=await analizarImagen(bl[i]);items.push({key:'pf'+i,fuente:'Portafolio',mini:a.vistas.original,foco:a.vistas.foco,a:{...a,vistas:null}})}catch{}}
    for(const g of (S.ajustes.galeria||[]).slice(-10)){try{const a=await analizarImagen(g);items.push({key:'g'+g.id,fuente:'Mis ilustraciones',titulo:g.titulo,tipoAuto:g.tipo,mini:a.vistas.original,foco:a.vistas.foco,a:{...a,vistas:null}})}catch{}}
  }catch{}S.rec={items};renderMain()}
function recAnalisis(items){const tags=S.ajustes.recTags||{},tipo=it=>tags[it.key]||(it.tipoAuto==='Entorno'?'Environment':it.tipoAuto)||'';
  const F=['mean','std','msat','warm','detalle'],mu={},sd={};F.forEach(f=>{const v=items.map(i=>i.a[f]);mu[f]=v.reduce((s,x)=>s+x,0)/v.length;sd[f]=Math.sqrt(v.reduce((s,x)=>s+(x-mu[f])**2,0)/v.length)||1});
  const NF={mean:['clave','más clara','más oscura'],std:['contraste','más contrastada','más plana'],msat:['saturación','más saturada','más apagada'],warm:['temperatura','más cálida','más fría'],detalle:['reparto de detalle','con detalle más concentrado','con detalle más repartido']};
  items.forEach(it=>{it.z=F.map(f=>[f,(it.a[f]-mu[f])/sd[f]]).filter(([,z])=>Math.abs(z)>=1.6);it.fuera=items.length>=5&&it.z.length>=2;
    it.lectura=it.a.separ*1.5+Math.max(...it.a.tres)*.8+it.a.detalle*.5-(it.a.foco2?.2:0)-Math.max(0,it.a.complej-5)*.04;it.tipo=tipo(it)});
  const orden=items.slice().sort((a,b)=>b.lectura-a.lectura),obj=['Environment','Keyframe'],primeros=items.slice(0,3),enObj=primeros.filter(i=>obj.includes(i.tipo)).length,conTipo=items.filter(i=>i.tipo).length;
  const quitar=[...items.filter(i=>i.fuera).map(i=>({it:i,por:'Se sale de tu idioma visual: '+i.z.map(([f,z])=>NF[f][z>0?1:2]).join(', ')+' que el resto.'})),...items.filter(i=>i.tipo==='Fan art').map(i=>({it:i,por:'Fan art: a un estudio le importa tu diseño original.'}))];
  const cuenta=t=>items.filter(i=>i.tipo===t).length,falta=[];
  if(conTipo>=items.length*.6){if(cuenta('Environment')<4)falta.push(`Environments: tienes ${cuenta('Environment')}, un junior de Environment necesita al menos 4–6.`);if(cuenta('Keyframe')<3)falta.push(`Keyframes: tienes ${cuenta('Keyframe')}, apunta a 3+ con narrativa clara.`);
    const off=items.filter(i=>i.tipo&&!obj.includes(i.tipo)&&i.tipo!=='Estudio').length;if(off>items.length*.4)falta.push(`${off} de ${items.length} piezas no son de tu objetivo (Environment & Keyframe). Ponlas en una sección aparte o quítalas.`)}
  else falta.push('Etiqueta el tipo de cada pieza (abajo) para saber qué te falta.');
  const proc=Object.values(S.P).filter(p=>new Set((p.piezas||[]).map(x=>x.etapa)).size>=3).length;if(proc<2)falta.push(`Proceso: ${proc} proyecto(s) con 3+ etapas subidas. Los estudios quieren ver cómo piensas: usa el Breakdown de proceso.`);
  return {orden,primeros,enObj,quitar,falta,items}}
function vReclutador(){const R=S.rec,chk=S.ajustes.recCheck||{},tags=S.ajustes.recTags||{};
  let body='';if(R?.busy)body='<p class="muted">Descargando y midiendo tus piezas…</p>';
  else if(R?.items?.length){const X=recAnalisis(R.items),card=(it,extra='')=>`<figure class="rc"><img src="${it.mini}" alt="" loading="lazy"><figcaption>${it.titulo?esc(corto(it.titulo,28))+' · ':''}<span class="muted">${esc(it.fuente)}</span>${extra}</figcaption></figure>`;

      <div class="rcs">${X.orden.map((it,i)=>card(it,` · <b>#${i+1}</b>${it.a.foco2?' · 2 focos':''}`)).join('')}</div></div>
    <div class="grid2"><div class="box"><h3>Qué quitar o mover <span class="lbl">${X.quitar.length}</span></h3>${X.quitar.length?`<div class="rcs">${X.quitar.map(q=>card(q.it,`<br><small>${esc(q.por)}</small>`)).join('')}</div>`:'<p class="ok-box">Nada se sale claramente de tu idioma visual.</p>'}</div>
      <div class="box"><h3>Qué te falta</h3>${X.falta.length?`<ul class="why-l">${X.falta.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:'<p class="ok-box">Tienes la cantidad base para tu especialidad.</p>'}</div></div>
    <div class="box"><h3>Coherencia de estilo · etiqueta cada pieza</h3><p class="hint">Mide clave, contraste, saturación, temperatura y reparto de detalle de todas juntas. Las marcadas se salen del promedio en 2 o más medidas. Es una señal, no un veredicto: una pieza distinta puede ser intencional.</p>
      <div class="rcs">${X.items.map(it=>`<figure class="rc ${it.fuera?'fuera':''}"><img src="${it.mini}" alt="" loading="lazy"><figcaption>${it.fuera?'<b style="color:var(--warn)">Se sale</b> · ':''}<select data-rectag="${esc(it.key)}" aria-label="Tipo"><option value="">Tipo…</option>${REC_TIPOS.map(t=>`<option ${it.tipo===t?'selected':''}>${t}</option>`).join('')}</select></figcaption></figure>`).join('')}</div></div>`}
  return `<h1 class="ptitle" style="font-size:clamp(30px,5vw,52px)">Revisión de reclutador</h1>
  <p class="intro">Tu portafolio como lo ve un estudio: la prueba de los 10 segundos, qué quitar, qué te falta para <strong>Environment & Keyframe</strong> y si todo habla el mismo idioma visual. Mide tus imágenes de verdad; lo demás es tu checklist.</p>
  <div class="box"><div class="prow" style="justify-content:space-between"><h3>Tu portafolio</h3><span class="prow"><input type="text" data-aj="portafolioUrl" id="rec-url" value="${esc(S.ajustes.portafolioUrl||PF_URL_DEF)}" style="width:320px;max-width:100%"><button class="btn pri" data-act="rec-go">${R?.items?'Volver a revisar':'Revisar mi portafolio'}</button></span></div>
    <p class="hint">Lee las imágenes de tu portafolio (en su orden) y las últimas de Mis ilustraciones.</p></div>
  ${body}
  <div class="box"><h3>Checklist de reclutador · ${REC_CHECK.filter(([k])=>chk[k]).length}/${REC_CHECK.length}</h3><div class="checks">${REC_CHECK.map(([k,t])=>`<label class="chk"><input type="checkbox" data-aj="recCheck.${k}" ${chk[k]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></div>`}

/* ---------- acciones ---------- */
async function accionPro(a,el,p,ds){
  switch(a){

async function accion(a,el){
  const p=S.P[S.cur],ds=el.dataset;
  if(['abrir','vista','nuevo','abrir-tab'].includes(a))S.menu=false;
  switch(a){
    case 'nuevo':{const id=uid();S.P[id]=nuevoProyecto('Nuevo proyecto');S.cur=id;S.vista='proyecto';S.tab='brief';S.ai={};recordar();marcar();render();setTimeout(()=>{const t=$('#f-nombre');t?.focus();t?.select()},0);break}
    case 'abrir':S.cur=ds.id;S.vista='proyecto';S.ai={};S.confirmDel=false;S.hist=null;recordar();render();snapshot(ds.id);break;
    case 'vista':S.vista=ds.v;S.hist=null;render();if(ds.v==='papelera')verPapelera();if(ds.v==='vacantes')cargarVacantes(false);if(ds.v==='recursos')cargarRecursos(false);if(ds.v==='avisos')cargarAvisos();break;
    case 'tab':S.tab=TAB_ALIAS[ds.tab]||ds.tab;S.confirmDel=false;renderMain();window.scrollTo({top:0});break;
    case 'tension':p.concepto.tension=ds.v;marcar();renderMain();break;
    case 'provo':S.provo=(S.provo+1+Math.floor(Math.random()*(PROVOCACIONES.length-1)))%PROVOCACIONES.length;renderMain();break;
    case 'empuje':{const t=$('#f-empuje'),v=t?.value.trim();if(!v)return;
      p.concepto.empujes.push(`${v}  (← ${PROVOCACIONES[S.provo%PROVOCACIONES.length]})`);marcar();renderMain();$('#f-empuje')?.focus();break}
    case 'del-empuje':p.concepto.empujes.splice(+ds.i,1);marcar();renderMain();break;
    case 'kw-del':p.keywords[ds.kw].splice(+ds.i,1);marcar();renderMain();break;
    case 'bq':{const t=$('#f-bq'),v=t?.value.trim();if(!v)return;p.busquedas.push({q:v,capa:$('#f-bqcapa').value});marcar();renderMain();$('#f-bq')?.focus();break}
    case 'bq-del':p.busquedas.splice(+ds.i,1);marcar();renderMain();break;
    case 'combinar':{const pick=k=>{const a=p.keywords[k]||[];return a[Math.floor(Math.random()*a.length)]};
      const partes=[pick('forma')||pick('cultura'),pick('material'),pick('luz')||pick('emocion')].filter(Boolean);
      if(partes.length<2){toast('Agrega más keywords para combinar');return}
      const t=$('#f-bq');if(t){t.value=partes.join(' ');t.focus()}break}
    case 'pal-add':p.mood.paleta.push('#888888');marcar();renderMain();break;
    case 'pal-del':p.mood.paleta.splice(+ds.i,1);marcar();renderMain();break;
    case 'ref-del':{if(S.confirmRef!==ds.id){S.confirmRef=ds.id;renderMain();return}
      const i=p.refs.findIndex(r=>r.id===ds.id);const [r]=p.refs.splice(i,1);S.confirmRef=null;marcar();renderMain();
      break}
    case 'unzoom':$('#overlay').innerHTML='';break;
    case 'borrar':{if(!S.confirmDel){S.confirmDel=true;renderMain();return}
      const id=S.cur;clearTimeout(saveT);await snapshot(id,true);S.dirty=false;delete S.P[id];S.confirmDel=false;
      try{if(S.db)await S.db.collection('proyectos').doc(id).delete();else lsSet()}catch{}
      S.cur=ordenados()[0]?.[0]||null;if(!S.cur)S.vista='inicio';recordar();render();toast('Proyecto borrado');break}
    case 'pap-del':{const k='pap:'+ds.pid;if(S.confirmLi!==k){S.confirmLi=k;renderMain();return}S.confirmLi=null;
      try{if(S.db){for(const h of await histDe(ds.pid))await S.db.collection('historial').doc(h.pid+'~'+h.ts).delete()}
        else{try{localStorage.setItem('cdc.hist',JSON.stringify(histLocal().filter(x=>x.pid!==ds.pid)))}catch{}}
        toast('Borrado para siempre')}catch{toast('No se pudo borrar')}
      verPapelera();break}
    case 'cancel-del':S.confirmDel=false;renderMain();break;
    case 'taller-start':turnoTaller('Empecemos. Hazme la primera pregunta.');break;
    case 'taller':{const t=$('#f-taller'),v=t?.value.trim();if(v)turnoTaller(v);break}
    case 'taller-reset':if(!S.confirmTaller){S.confirmTaller=true;renderMain();return}S.confirmTaller=false;p.taller=[];marcar();renderMain();break;
    case 'taller-aplicar':{const ult=[...(p.taller||[])].reverse().find(m=>m.role==='assistant'),x=pilaresDe(ult?.content);if(!x)return;
      p.pilares=x.map(q=>({t:String(q.t||''),f:String(q.f||'')}));marcar();renderMain();toast('Pilares aplicados');break}
    case 't-go':{const t=S.timer;S.timer={fin:Date.now()+(t?t.resta:(+ds.min||30)*60e3)};if(S.timer.fin<=Date.now())S.timer={fin:Date.now()+(+ds.min||30)*60e3};renderMain();break}
    case 't-pausa':S.timer={resta:Math.max(0,S.timer.fin-Date.now())};renderMain();break;
    case 't-reset':S.timer=null;renderMain();break;
    case 'd-hecho':case 'd-deshacer':case 'd-otro':case 'd-usar-crit':case 'd-usar-ai':{
      const r=S.ajustes.rutina=S.ajustes.rutina||{dias:{}},k=hoyKey(),cur=ejercicioDeHoy(),nota=$('#d-nota')?.value||'';
      if(a==='d-hecho')r.dias[k]={...cur,nota,hecho:true,ts:Date.now()};
      else if(a==='d-deshacer'){if(r.dias[k])r.dias[k].hecho=false}
      else if(a==='d-otro'){const i=((cur.i??0)+1)%3;r.dias[k]={skill:cur.skill,texto:EJERCICIOS[cur.skill][i],i,nota}}
      else if(a==='d-usar-crit'){const u=Object.values(S.P).flatMap(p=>p.piezas||[]).filter(x=>x.feedback?.ejercicio).sort((a,b)=>(b.fbFecha||0)-(a.fbFecha||0))[0];if(u)r.dias[k]={skill:cur.skill,texto:u.feedback.ejercicio,nota}}
      else{const d=S.ai.diario?.data;if(d)r.dias[k]={skill:cur.skill,texto:d.ejercicio+(d.pasos?.length?' — '+d.pasos.join(' / '):''),nota}}

    case 'reto-proyecto':{const r=S.retoAI||retoLocal(S.retoSeed),id=uid(),tipo=r.tipo==='Key art'?'Key art':r.tipo;
      const titulo=r.proyecto||`${r.sujeto[0].toUpperCase()+r.sujeto.slice(1)}, ${r.genero}`;
      const np=nuevoProyecto('Reto · '+titulo);np.tipo=TIPOS.includes(tipo)?tipo:'Ilustración';np.encargo=r.estudio+' (reto de estudio)';
      np.brief.texto=(r.brief||`Diseña ${r.sujeto} para un proyecto de ${r.genero}.`)+(r.contexto_ad?.length?'\nNotas de AD: '+r.contexto_ad.join('; '):'');
      np.brief.entregable=Array.isArray(r.entregables)?r.entregables.join(' · '):r.entrega;np.brief.restricciones=(r.restricciones||[]).join(' · ')+` · Tiempo: ${Math.round((r.min||120)/60*10)/10} h`;
      S.P[id]=np;S.ajustes.retos=S.ajustes.retos||[];S.ajustes.retos.push({ts:Date.now(),titulo,pid:id});marcarAj();
      S.cur=id;S.vista='proyecto';S.tab='brief';recordar();marcar();render();toast('Reto convertido en proyecto');break}
    case 'pz-proponer':{const x=p.piezas.find(z=>z.id===ds.id);if(!x)return;
      if(x.pf){S.vista='portafolio';render();return}
      proponer(x,{titulo:p.nombre,disciplina:/Proyecto completo/.test(p.tipo)?'Visual Development / Worldbuilding':p.tipo==='Entorno'?'Environment Concept':p.tipo==='Key art'?'Keyframe / Key Art':p.tipo+' Design',seccion:/Personaje|Criatura/.test(p.tipo)?'characters':'projects'});marcar();renderMain();toast('Propuesta: revísala con tu asesor en Portafolio');break}
    case 'est-proponer':{const x=S.ajustes.estiloImgs?.[+ds.i];if(!x)return;if(!x.pf){proponer(x,{});marcarAj();toast('Propuesta para portafolio')}S.vista='portafolio';render();break}
    case 'pf-ok':{const k=ds.k,{x}=pfDe(k);if(!x?.pf)return;if(!(x.pf.titulo.trim()&&x.pf.revisada&&x.pf.mejor))return;
      if(S.confirmPf!==k){S.confirmPf=k;renderMain();return}S.confirmPf=null;x.pf.estado='aprobada';x.pf.aprobado=Date.now();guardarPf(k);render();toast('Visto bueno dado');break}
    case 'pf-revocar':{const {x}=pfDe(ds.k);if(!x?.pf)return;x.pf.estado='candidata';delete x.pf.aprobado;guardarPf(ds.k);render();break}
    case 'pf-publicada':{const {x}=pfDe(ds.k);if(!x?.pf)return;x.pf.estado='publicada';x.pf.publicada=Date.now();guardarPf(ds.k);render();break}
    case 'pf-quitar':{const {x}=pfDe(ds.k);if(!x)return;delete x.pf;guardarPf(ds.k);render();break}
    case 'pf-paquete':paquetePortafolio().catch(()=>{expStatus('');toast('No se pudo armar el paquete')});break;
    case 'fav':{const r=S.ajustes.referentes[+ds.i];if(!r)return;r.fav=!r.fav;marcarAj();renderMain();break}
    case 'cot-hist':cargarCotHist();break;
    case 'av-key':{const k=$('#av-key')?.value.trim();if(!/^re_/.test(k||'')){toast('Esa no parece una clave de Resend (empieza con re_)');return}try{await window.PC_SHIM.setSecret('resend',k);S.avisosKey=true;S.ajustes.avisos={activo:true,email:'salvarezdelfin@gmail.com',...(S.ajustes.avisos||{})};marcarAj();renderMain();toast('Correo conectado')}catch{toast('No se pudo guardar')}break}

    case 'ai-bq':{const b=S.ai.keywords?.data?.busquedas?.[+ds.i];if(b){p.busquedas.push({q:String(b.q),capa:LAYERS.some(l=>l.k===b.capa)?b.capa:'concepto'});marcar();el.textContent='Añadida';el.disabled=true}break}
    case 'ai-est':{const b=S.ai.keywords?.data?.estudiar?.[+ds.i];if(b){p.busquedas.push({q:String(b.nombre),capa:LAYERS.some(l=>l.k===b.capa)?b.capa:'concepto'});marcar();el.textContent='Añadida';el.disabled=true}break}
    case 'ai-dir':{const x=S.ai.ideas?.data?.direcciones?.[+ds.i];if(!x)return;
      const vacio=!p.concepto.nucleos.some(n=>n.trim())&&!p.pilares.some(pl=>pl.t.trim());
      if(!vacio&&S.confirmDir!==+ds.i){S.confirmDir=+ds.i;renderMain();return}
      S.confirmDir=null;const nu=(x.nucleos||[]).map(String).slice(0,3);while(nu.length<3)nu.push('');
      p.concepto.nucleos=nu;p.concepto.tension=TENSIONES.some(t=>t[0]===x.tension)?x.tension:p.concepto.tension;
      p.concepto.tensionTexto=String(x.tensionTexto||'');p.concepto.frase=String(x.idea||'');
      (x.pilares||[]).slice(0,3).forEach((pl,j)=>{p.pilares[j]={t:String(pl.t||''),f:String(pl.f||'')}});
      if(x.mundo&&!p.mundo.rol)p.mundo.rol=String(x.mundo);
      if(x.mood){p.mood.sensacion=String(x.mood.sensacion||'');p.mood.palabras=String(x.mood.palabras||'');const pal=(x.mood.paleta||[]).filter(c=>/^#[0-9a-f]{6}$/i.test(c));if(pal.length>=3)p.mood.paleta=pal}
      if(x.tecnica){p.tecnica.medio=String(x.tecnica.medio||'');p.tecnica.acabado=String(x.tecnica.acabado||'');if(x.tecnica.referentes)p.tecnica.referentes=String(x.tecnica.referentes)}
      (x.busquedas||[]).forEach(b=>{if(b?.q&&!p.busquedas.some(y=>y.q===b.q))p.busquedas.push({q:String(b.q),capa:LAYERS.some(l=>l.k===b.capa)?b.capa:'concepto'})});
      marcar();S.tab='concepto';render();toast('Dirección aplicada: ahora empújala');break}
    case 'critica':pedirCritica(ds.id);break;
    case 'crit-stop':S.critCtl?.abort();break;
    case 'pz-del':{if(S.confirmRef!==ds.id){S.confirmRef=ds.id;renderMain();return}
      const i=p.piezas.findIndex(x=>x.id===ds.id);const [x]=p.piezas.splice(i,1);S.confirmRef=null;marcar();renderMain();
      break}
    case 'enc-save':{const e=S.ai.encuadres?.data?.encuadres?.[+ds.i];if(e){p.encuadres.push({nombre:String(e.nombre||''),camara:String(e.camara||''),composicion:String(e.composicion||'')});marcar();el.textContent='Guardado';el.disabled=true}break}
    case 'enc-del':p.encuadres.splice(+ds.i,1);marcar();renderMain();break;
    case 'descubrir':{const t=$('#f-tema');S.tema=t?.value.trim()||'';if(!S.tema){toast('Escribe un tema');return}preguntar('descubrir');break}
    case 'abrir-tab':S.cur=ds.id;S.vista='proyecto';S.tab=ds.tab;S.ai={};recordar();render();break;
    case 'salir':window.PC_SHIM?.signOut();break;
    case 'ia':window.PC_SHIM?.openSettings();break;
    case 'menu':S.menu=!S.menu;renderSide();break;
    case 'art-seguir':{const a=S.ai[ds.k||'artistas']?.data?.artistas?.[+ds.i];if(!a)return;
      if(!S.ajustes.referentes.some(r=>r.nombre===a.nombre)){S.ajustes.referentes.push({nombre:String(a.nombre),porque:`${a.estudiar||''} (${a.conocido_por||''})`});marcarAj()}
      if(p&&S.vista==='proyecto'&&!p.tecnica.referentes.includes(a.nombre)){p.tecnica.referentes=[p.tecnica.referentes,a.nombre].filter(Boolean).join(', ');marcar()}
      el.textContent='Siguiendo';el.disabled=true;break}
    case 'art-buscar':{const a=S.ai[ds.k||'artistas']?.data?.artistas?.[+ds.i];if(a&&p){const q=String(a.nombre)+' concept art';if(!p.busquedas.some(b=>b.q===q))p.busquedas.push({q,capa:LAYERS.some(l=>l.k===a.capa)?a.capa:'tecnica'});marcar();el.textContent='Añadida';el.disabled=true}break}
    case 'seis-go':S.tab='direccion';renderMain();preguntar('seis');break;
    case 'seis-use':{const o=S.ai.seis?.data?.[ds.k]?.[+ds.i];if(!o)return;const k=ds.k;
      if(k==='concepto')p.concepto.frase=String(o.v||'');
      else if(k==='mood'){p.mood.sensacion=String(o.sensacion||'');p.mood.palabras=String(o.palabras||'');const pal=(o.paleta||[]).filter(c=>/^#[0-9a-f]{6}$/i.test(c));if(pal.length>=3)p.mood.paleta=pal.slice(0,8)}
      else if(k==='tecnica'){p.tecnica.medio=String(o.medio||'');p.tecnica.acabado=String(o.acabado||'');if(o.referentes)p.tecnica.referentes=String(o.referentes)}
      else{const j=+k[1]-1;p.pilares[j]={t:String(o.t||''),f:String(o.f||'')}}
      (o.busquedas||[]).forEach(q=>{q=String(q||'').trim();if(q&&!p.busquedas.some(b=>b.q===q))p.busquedas.push({q,capa:k})});
      marcar();renderMain();toast('Aplicado · sus búsquedas ya están en Referencias');break}
    case 'ai-dir-emp':{const x=S.ai.ideas?.data?.direcciones?.[+ds.i];if(x){p.concepto.empujes.push(`${x.titulo}: ${x.idea}`);marcar();el.textContent='Guardado';el.disabled=true}break}
    case 'exp-zip':exportZip().catch(()=>{expStatus('');toast('No se pudo armar el ZIP')});break;
    case 'exp-png':exportPNG();break;
    case 'exp-carpeta':exportCarpeta();break;
    case 'ref-copy':{const r=p.refs.find(x=>x.id===ds.id);if(r)copiarRef(r,el);break}
    case 'copiar-md':{const txt=aMarkdown(p);try{await navigator.clipboard.writeText(txt);toast('Copiado')}catch{toast('No se pudo copiar')}break}
    case 'exportar-md':{const txt=aMarkdown(p);
      if(S.downloads){try{await S.downloads.save({filename:(p.nombre||'concepto').replace(/[^\w\- ]+/g,'').trim()+'.md',data:txt});toast('Descargado')}catch(e){if(e?.code!=='declined')toast('No se pudo descargar')}}
      else{try{await navigator.clipboard.writeText(txt);toast('Descarga no disponible: copiado al portapapeles')}catch{toast('Descarga no disponible aquí')}}break}
    default:if(!(await accionPro(a,el,p,ds))&&!(await accionFmt(a,el,p,ds))&&!(await accionRec(a,el,p,ds))&&!(await accionPot(a,el,p,ds)))await accionDir(a,el,p,ds);
  }
}
window.addEventListener('beforeunload',()=>{if(S.dirty)guardar()});
arrancar();
</script>
