<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Potenciador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Potenciador de Conceptos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Interfaz de estudio: un solo tema oscuro, deliberado (como las herramientas de arte) */
:root{
  color-scheme:dark;
  --bg:#0b0c0f; --rail:#101217; --surface:#15181e; --surface2:#1d2129; --surface3:#262b35;
  --ink:#eceef2; --ink2:#a9afba; --ink3:#6f7683; --line:#262a33; --line2:#323845;
  --accent:#ff6a3d; --accent-ink:#140905; --accent-soft:rgba(255,106,61,.14);
  --c-concepto:#7c8cff; --c-mood:#e27cc1; --c-tecnica:#e5b04a; --c-ad:#3fc9a8;
  --warn:#ff7d6e; --ok:#5fd08a; --warn-bg:rgba(255,125,110,.12); --ok-bg:rgba(95,208,138,.12);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --railw:264px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0;margin:0;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
.app{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.main{padding:28px clamp(16px,3vw,40px) 64px;max-width:1280px;width:100%}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.main{padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}}

/* ---------- app shell ---------- */
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--rail);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
.brand{font-family:var(--display);font-weight:900;font-size:30px;line-height:.9;letter-spacing:.01em;text-transform:uppercase;padding:0 8px}
.brand em{font-style:normal;color:var(--accent)}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.12em;color:var(--ink3);margin-top:10px;text-transform:uppercase}
.pitem{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:14px}
.pitem svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pitem:hover{background:var(--surface);color:var(--ink)}
.pitem[aria-current="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .s{font-family:var(--mono);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pitem .meta{grid-column:2/-1;font-size:12px;color:var(--ink3);margin-top:-6px}
.pitem .dotp{width:8px;height:8px;border-radius:50%;justify-self:center}
.navlinks{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:14px}
.status{font-family:var(--mono);font-size:11px;color:var(--ink3);padding:0 10px;margin-top:auto}
.bottombar{display:none}
@media (max-width:860px){
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:40;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));box-shadow:20px 0 60px rgba(0,0,0,.5)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(16,18,23,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink3);font-size:10.5px;padding:6px 0;cursor:pointer}
  .bb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bb[aria-current="true"]{color:var(--accent)}
  .bb.fab svg{background:var(--accent);color:var(--accent-ink);stroke:var(--accent-ink);border-radius:12px;width:40px;height:30px;padding:5px 9px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* sidebar */
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.plist{display:flex;flex-direction:column;gap:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.ptitle{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,40px);line-height:1.05;letter-spacing:-.02em;border:0;background:transparent;padding:0;width:100%;min-width:0}
.ptitle:focus{outline:none;border-bottom:2px solid var(--accent)}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prow select,.prow input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px;font-size:13px}
.health{display:flex;align-items:center;gap:10px}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;width:140px}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:transparent;padding:10px 12px;cursor:pointer;white-space:nowrap;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.tab b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink3);margin-right:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}

.panel{display:flex;flex-direction:column;gap:18px}
.intro{max-width:70ch;color:var(--ink2)}
.intro strong{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.box .hint{font-size:13px;color:var(--ink3);margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:500;color:var(--ink2)}
textarea,input[type=text],.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;resize:vertical;min-width:0}
textarea{min-height:64px}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--accent)}
.big textarea{min-height:130px}

.nucleos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.nuc{position:relative}
.nuc input{font-family:var(--display);font-weight:700;font-size:19px;padding:14px 12px 10px}
.nuc span{position:absolute;top:-7px;left:10px;background:var(--surface);padding:0 4px;font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.08em}
.tensions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tens{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px;text-align:left;cursor:pointer}
.tens b{display:block;font-weight:600;font-size:14px}
.tens small{color:var(--ink3);font-size:12px;line-height:1.35;display:block}
.tens[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.provo{border:1px dashed var(--ink3);border-radius:8px;padding:16px;font-family:var(--display);font-size:20px;font-weight:500;line-height:1.25;text-wrap:balance}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:8px 10px;background:var(--bg);border-radius:6px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:14px;padding:3px 4px 3px 10px;font-size:13px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--ink3);padding:0 4px;font-size:14px;line-height:1}
.kwcat{border-top:3px solid var(--line)}

.pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{position:relative;width:44px;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.sw input{position:absolute;inset:-8px;width:60px;height:60px;border:0;padding:0;cursor:pointer}
.sw button{position:absolute;top:1px;right:1px;border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:3px;font-size:10px;line-height:1;padding:2px 4px;cursor:pointer;display:none}
.sw:hover button{display:block}
.pillar{border-top:4px solid var(--c-ad)}
.pillar .num{font-family:var(--mono);font-size:11px;color:var(--c-ad);letter-spacing:.08em}
.pillar input[type=text]{font-family:var(--display);font-weight:700;font-size:18px}
.layer-concepto{--lc:var(--c-concepto)} .layer-mood{--lc:var(--c-mood)} .layer-tecnica{--lc:var(--c-tecnica)} .layer-p1,.layer-p2,.layer-p3{--lc:var(--c-ad)}

/* moodboard */
.drop{border:1.5px dashed var(--ink3);border-radius:8px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--surface2)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:8px;padding:10px;border-top:4px solid var(--lc);min-width:0}
.colh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.colh b{font-family:var(--display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colh span{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.col .desc{font-size:12px;color:var(--ink3);margin:-6px 0 0;line-height:1.35}
.ref{background:var(--bg);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;border:1px solid transparent}
.ref.nowhy{border-color:var(--warn)}
.ref img{width:100%;display:block;max-height:260px;object-fit:cover;cursor:zoom-in;background:var(--surface2)}
.ref .rb{padding:8px;display:flex;flex-direction:column;gap:6px}
.ref textarea{min-height:52px;font-size:13px;padding:6px 8px;background:var(--surface)}
.ref .rrow{display:flex;gap:6px;align-items:center}
.ref .rrow select{flex:1;min-width:0;font-size:12px;padding:3px 4px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.ref .warn{font-size:11.5px;color:var(--warn);font-family:var(--mono)}
.empty{font-size:12.5px;color:var(--ink3);padding:14px 6px;text-align:center;border:1px dashed var(--line);border-radius:6px}
.searches{display:flex;flex-direction:column;gap:6px}
.sq{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:6px;font-size:14px}
.sq .q{font-weight:500;flex:1 1 200px}
.sq a{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;color:var(--lc);border:1px solid var(--lc)}

/* checklist */
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:6px;background:var(--bg);cursor:pointer}
.chk input{margin-top:4px;accent-color:var(--accent)}
.chk b{font-weight:500}
.chk small{display:block;color:var(--ink3);font-size:12.5px}
.health-list{display:flex;flex-direction:column;gap:4px}
.hl{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;font-size:14px;padding:5px 8px;border-radius:5px}
.hl.ok{color:var(--ink2)} .hl.ok i{color:var(--ok)} .hl.no i{color:var(--warn)}
.hl i{font-style:normal;font-weight:700;text-align:center}
.hl button{font-size:12px}

/* asesor */
.asesor{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.asesor .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.asesor .top b{font-family:var(--display);font-size:16px}
.aiout{font-size:14px;max-width:75ch}
.aiout h4{font-family:var(--display);margin:10px 0 4px;font-size:15px}
.aiout ul{margin:4px 0;padding-left:20px}
.aiout p{margin:6px 0}
.aiitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:8px 10px;background:var(--bg);border-radius:6px;margin-top:6px}
.aiitem small{display:block;color:var(--ink3)}
.muted{color:var(--ink3);font-size:13px}

/* hoja */
.sheet{background:var(--surface);border-radius:10px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:26px;box-shadow:var(--shadow)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,54px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.sheet .logline{font-size:clamp(17px,2vw,21px);max-width:60ch;color:var(--ink2);margin:0}
.sheet .tension{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--display);font-weight:700;font-size:22px}
.sheet .tension em{font-family:var(--mono);font-style:normal;font-weight:400;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:2px 6px}
.shgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.shgrid h5{margin:0 0 6px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lc,var(--ink3))}
.shgrid p{margin:0;font-size:14px}
.shpil{border-top:3px solid var(--c-ad);padding-top:10px}
.shpil b{font-family:var(--display);font-size:19px;display:block}
.mosaic{columns:4 160px;column-gap:8px}
.mosaic figure{break-inside:avoid;margin:0 0 8px;position:relative}
.mosaic img{width:100%;display:block;border-radius:4px}
.mosaic figcaption{font-size:11.5px;color:var(--ink2);padding:3px 2px 0;line-height:1.3}

/* principios / progreso */
.princ{counter-reset:p;display:flex;flex-direction:column;gap:8px}
.princ .pr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start}
.princ .pr::before{counter-increment:p;content:counter(p,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--ink3);padding-top:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:8px;padding:14px}
.stat b{font-family:var(--display);font-size:30px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink3)}
.learn{padding:10px 12px;background:var(--surface);border-radius:6px;font-size:14px}
.learn small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3)}

.seiswrap{display:flex;flex-direction:column;gap:8px}
.seishead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seisgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.seis{border:0;border-top:4px solid var(--lc);background:var(--surface);border-radius:6px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.seis:hover{box-shadow:var(--shadow)}
.seis .lbl{color:var(--lc)}
.seis .v{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.seis .v i{font-style:normal;color:var(--warn);font-weight:400}
.seis .nr{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.slot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:3px solid var(--lc)}
.slot h4{margin:0;color:var(--lc)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{background:var(--bg);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.opt b{font-family:var(--display);font-size:15px}
.opt .q{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.colq{display:flex;flex-direction:column;gap:2px;font-size:12px}
.colq a{color:var(--lc);text-decoration:none;font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colq a:hover{text-decoration:underline}
.pz{display:grid;grid-template-columns:minmax(220px,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.pz{grid-template-columns:minmax(0,1fr)}}
.pzimg img{width:100%;border-radius:6px;display:block;cursor:zoom-in;background:var(--surface2)}
.pzbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.fb{display:flex;flex-direction:column;gap:12px;font-size:14px}
.fbtop{display:flex;flex-direction:column;gap:6px}
.nivel{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:2px 6px}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rev{background:var(--bg);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.rev h4{margin:0;font-family:var(--display);font-size:15px}
.corr{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13.5px;cursor:pointer}
.corr input{margin-top:4px;accent-color:var(--accent)}
.corr small{display:block;color:var(--ink2)}
.corr:has(input:checked) span{opacity:.5;text-decoration:line-through}
.timer{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.timer b{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cal{display:grid;grid-template-columns:repeat(7,22px);gap:5px}
.dia{width:22px;height:22px;border-radius:5px;background:var(--surface3)}
.dia.on{background:var(--accent)}
.dia.hoy{outline:2px solid var(--ink3);outline-offset:1px}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.kanban{grid-template-columns:minmax(0,1fr)}}
.kcol{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.pfcard{background:var(--bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pfcard>img{width:100%;max-height:240px;object-fit:cover;cursor:zoom-in;background:var(--surface2)}
.pfb{padding:10px;display:flex;flex-direction:column;gap:8px}
.pfb input,.pfb select,.pfb textarea{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:13px;min-width:0}
.pfb textarea{min-height:48px}
.pfb .prow>input{flex:1}
.pfrev{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.cotbig{font-family:var(--display);font-weight:900;font-size:clamp(40px,6vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.desg{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.desg span{color:var(--ink2)}.desg b{text-align:right;font-variant-numeric:tabular-nums}
.guias{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.guia{background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.guia b{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1}
.guia textarea{min-height:44px;font-size:13px}
.star{border:0;background:none;cursor:pointer;font-size:18px;color:var(--ink3);padding:0 4px}
.star.on{color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.msg p{margin:4px 0}.msg ul,.msg ol{margin:4px 0;padding-left:18px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.assistant{align-self:flex-start;background:var(--surface3);border-bottom-left-radius:4px}
.stepper{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stepper::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;color:var(--ink2);font-size:13px}
.step .sn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);font-family:var(--mono);font-size:11px}
.step.done .sn{background:var(--ok-bg);color:var(--ok)}
.step.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.step.on .sn{background:var(--accent);color:var(--accent-ink)}
.estilo-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.estilo-imgs figure{margin:0;position:relative}
.estilo-imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--surface2)}
.estilo-imgs button{position:absolute;top:4px;right:4px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px}
.score{display:grid;grid-template-columns:150px 1fr 22px;gap:4px 8px;align-items:center;font-size:13px}
.score b{font-variant-numeric:tabular-nums;text-align:right}
.score small{grid-column:1/-1;color:var(--ink3);font-size:12px;margin-top:-2px}
.next{margin:0;padding:10px 12px;border-radius:6px;background:var(--ok-bg)}
@media (max-width:860px){input,textarea,select{font-size:16px!important}}

/* ---------- acabado de app ---------- */
.btn{border-radius:8px;background:var(--surface2);border-color:var(--line2);transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface3);border-color:var(--ink3)}
.btn.pri{font-weight:600}
.btn.pri:hover{background:#ff7d55;border-color:#ff7d55}
.box{background:var(--surface);border-color:var(--line);border-radius:12px;padding:18px}
.box h3{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.ptitle{font-family:var(--display)!important;font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.95}
textarea,input[type=text],.field select,.prow select,.prow input{background:var(--bg);border-color:var(--line2);border-radius:8px}
.intro{color:var(--ink2);font-size:15.5px}

.tabs{border-bottom:0;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border-radius:8px;border-bottom:0;margin:0;padding:8px 12px;font-size:13.5px}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{background:var(--surface3);color:var(--ink);border-bottom:0;box-shadow:inset 0 -2px 0 var(--accent)}
.seis{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--lc);border-radius:10px}
.seis:hover{background:var(--surface2)}
.asesor{background:linear-gradient(135deg,var(--accent-soft),transparent 55%),var(--surface);border-color:var(--line);border-left:3px solid var(--accent);border-radius:12px}
.asesor .top b{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.01em}
.col{background:var(--surface);border-radius:12px}
.ref{background:var(--bg);border-radius:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat b{font-family:var(--display);font-weight:800;font-size:40px}
.sheet{background:var(--surface);border:1px solid var(--line)}
.sheet h2,.sheet .tension{font-family:var(--display);text-transform:uppercase}
.drop{background:var(--surface);border-color:var(--line2);border-radius:12px}
.chip{background:var(--surface3)}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;font-weight:500}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.phead{position:static;background:none;margin:0;padding:0}}
@media (hover:none){.sw button{display:block}}
.lightbox{position:fixed;inset:0;background:rgba(8,9,12,.88);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;z-index:60}
.banner{background:var(--warn-bg);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.box,.col{transition:border-color .15s}}

<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><p class="muted">Cargando…</p></main>
</div>
<nav class="bottombar" id="bottombar" aria-label="Navegación"></nav>
<div id="scrim" data-act="menu"></div>
<div id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Potenciador de Conceptos — capa para GitHub Pages.
   Da a la app las mismas piezas que tiene como artifact (db, assets, sample, downloads)
   usando Supabase: login, datos privados por RLS, imágenes en bucket privado y Claude vía Edge Function. */
(function(){
  const SUPA_URL='https://smjktuithhvfmexysvkf.supabase.co';
  const SUPA_KEY='sb_publishable_h7YxlJXIADT1827fFx6hyg_jtjmnmGZ';
  const BUCKET='potenciador';
  const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  let listo;const ready=new Promise(r=>listo=r);
  let tieneLlave=false;

  /* ---------- estilos de login y modales ---------- */
  const css=document.createElement('style');css.textContent=`
  .pcx{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .pcx.modal{background:rgba(8,9,12,.6);align-items:flex-start;overflow:auto;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .pcx-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
  .pcx.modal .pcx-card{max-width:680px}
  .pcx-card h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em;margin:0}
  .pcx-card h2{font-family:var(--display);font-size:20px;margin:0}
  .pcx-card p{margin:0;color:var(--ink2);font-size:14px}
  .pcx-card input,.pcx-card textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 12px;font-size:16px}
  .pcx-card textarea{min-height:140px;font-family:var(--mono);font-size:13px}
  .pcx-err{color:var(--warn);font-size:13px;min-height:18px}
  .pcx-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pcx-link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
  .pcx-thumbs{display:flex;gap:8px;flex-wrap:wrap}.pcx-thumbs img{width:90px;height:90px;object-fit:cover;border-radius:4px}`;
  document.head.append(css);
  const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
  const escH=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- login ---------- */
  function pantallaLogin(msg){
    document.querySelector('.pcx.login')?.remove();
    const v=el(`<div class="pcx login"><form class="pcx-card" id="pcx-login">
      <h1>Potenciador<br>de Conceptos</h1><p>Tu sistema privado. Entra con tu cuenta.</p>
      <input type="email" id="pcx-email" autocomplete="username" placeholder="Correo" required>
      <input type="password" id="pcx-pass" autocomplete="current-password" placeholder="Contraseña" required>
      <div class="pcx-err" id="pcx-err">${escH(msg||'')}</div>
      <button class="btn pri" type="submit">Entrar</button>
      <button class="pcx-link" type="button" id="pcx-olvide">¿Olvidaste tu contraseña?</button></form></div>`);
    document.body.append(v);
    const err=t=>v.querySelector('#pcx-err').textContent=t;
    v.querySelector('form').addEventListener('submit',async e=>{
      e.preventDefault();err('Entrando…');
      const {error}=await sb.auth.signInWithPassword({email:v.querySelector('#pcx-email').value.trim(),password:v.querySelector('#pcx-pass').value});
      if(error){err(error.message.includes('Invalid')?'Correo o contraseña incorrectos.':error.message);return}
      await tras_login();
    });
    v.querySelector('#pcx-olvide').onclick=async()=>{
      const email=v.querySelector('#pcx-email').value.trim();if(!email){err('Escribe tu correo arriba primero.');return}
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      err(error?error.message:'Te mandamos un correo para cambiar tu contraseña.');
    };
  }
  function pantallaNuevaPass(){
    document.querySelector('.pcx.login')?.remove();
    const v=el(`<div class="pcx login"><form class="pcx-card"><h2>Nueva contraseña</h2>
      <input type="password" id="pcx-np" autocomplete="new-password" placeholder="Nueva contraseña (mín. 8)" minlength="8" required>
      <div class="pcx-err" id="pcx-err"></div><button class="btn pri" type="submit">Guardar</button></form></div>`);
    document.body.append(v);
    v.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();
      const {error}=await sb.auth.updateUser({password:v.querySelector('#pcx-np').value});
      if(error){v.querySelector('#pcx-err').textContent=error.message;return}
      await tras_login();});
  }
  async function tras_login(){
    const {data:ok}=await sb.rpc('pc_allowed');
    if(ok!==true){await sb.auth.signOut();pantallaLogin('Esta cuenta no tiene acceso a este sistema.');return}
    const {data:k}=await sb.rpc('pc_has_secret');tieneLlave=k===true;
    document.querySelector('.pcx.login')?.remove();listo();
  }
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')pantallaNuevaPass()});
  (async()=>{
    if(/type=recovery/.test(location.hash))return;// lo maneja onAuthStateChange
    const {data:{session}}=await sb.auth.getSession();
    if(session)await tras_login();else pantallaLogin();
  })();

  /* ---------- db: documentos JSON en pc_docs ---------- */
  const fallo=(error)=>({code:error?.code==='42501'?'invalid_argument':'unavailable',message:error?.message||''});
  const vigilantes=new Set();
  const refrescar=()=>vigilantes.forEach(f=>f());
  window.addEventListener('focus',refrescar);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refrescar()});
  function docRef(col,id){return{id,path:col+'/'+id,
    async get(){const {data,error}=await sb.from('pc_docs').select('data').match({col,id}).maybeSingle();if(error)throw fallo(error);return{id,exists:!!data,data:()=>data?.data,metadata:{fromCache:false,hasPendingWrites:false}}},
    async set(data){const {error}=await sb.from('pc_docs').upsert({col,id,data,updated_at:new Date().toISOString()});if(error)throw fallo(error)},
    async update(data){const s=await this.get();if(!s.exists)throw{code:'invalid_argument'};await this.set({...s.data(),...data})},
    async delete(){const {error}=await sb.from('pc_docs').delete().match({col,id});if(error)throw fallo(error)},
    onSnapshot(next,err){const f=async()=>{try{next(await this.get())}catch(e){}};vigilantes.add(f);f();return()=>vigilantes.delete(f)}
  }}
  const db={
    doc(path){const [c,i]=path.split('/');return docRef(c,i)},
    collection(col,filtro){return{path:col,doc:id=>docRef(col,id||crypto.randomUUID()),
      where(field,op,value){if(op!=='==')throw new TypeError('Solo == está soportado');return db.collection(col,[field,String(value)])},
      async get(){let q=sb.from('pc_docs').select('id,data').eq('col',col);if(filtro)q=q.eq('data->>'+filtro[0],filtro[1]);
        const {data,error}=await q;if(error)throw fallo(error);
        const docs=data.map(r=>({id:r.id,exists:true,data:()=>r.data,metadata:{fromCache:false,hasPendingWrites:false}}));
        return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}},
      onSnapshot(next,err){let primera=true;const f=async()=>{try{next(await this.get());primera=false}catch(e){if(primera)err?.(e)}};vigilantes.add(f);f();return()=>vigilantes.delete(f)}
    }}
  };

  /* ---------- assets: bucket privado + URLs firmadas ---------- */
  const urls={};
  const assets={
    async upload(blob){
      const ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');
      const path=`${crypto.randomUUID()}.${ext}`;
      const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type,cacheControl:'31536000'});
      if(error)throw{code:/size|large/i.test(error.message)?'too_large':'upstream_error',message:error.message};
      urls[path]=URL.createObjectURL(blob);return{id:path,url:urls[path],sizeBytes:blob.size,contentType:blob.type};
    },
    async delete(id){await sb.storage.from(BUCKET).remove([id]);delete urls[id];return{deleted:true}},
    async list(){return{assets:[],usage:{}}},
    url:id=>urls[id]||'',
    async blob(id){const {data,error}=await sb.storage.from(BUCKET).download(id);if(error)throw error;return data},
    async hydrate(){
      const imgs=[...document.querySelectorAll('img[data-asset]')].filter(i=>!i.getAttribute('src'));
      const faltan=[...new Set(imgs.map(i=>i.dataset.asset))].filter(id=>!urls[id]);
      if(faltan.length){const {data}=await sb.storage.from(BUCKET).createSignedUrls(faltan,60*60*12);(data||[]).forEach(d=>{if(d.signedUrl&&d.path)urls[d.path]=d.signedUrl})}
      document.querySelectorAll('img[data-asset]').forEach(i=>{if(!i.getAttribute('src')&&urls[i.dataset.asset])i.src=urls[i.dataset.asset]});
    }
  };

  /* ---------- downloads ---------- */
  const downloads={async save({filename,data}){
    const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),30000);return{status:'saved'};
  }};

  /* ---------- sample: Claude vía Edge Function, o puente copiar/pegar ---------- */
  async function aBase64(blob){
    const im=await createImageBitmap(blob);const k=Math.min(1,1568/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',.88);return{media_type:'image/jpeg',data:url.split(',')[1]};
  }
  const aMensajes=input=>typeof input==='string'?[{role:'user',content:input}]:input;
  async function directo(input,opts={}){
    const {data:{session}}=await sb.auth.getSession();
    const images=opts.images?await Promise.all([...opts.images].slice(0,5).map(aBase64)):[];
    let r;
    try{r=await fetch(`${SUPA_URL}/functions/v1/pc-claude`,{method:'POST',signal:opts.signal,
      headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+session?.access_token},
      body:JSON.stringify({messages:aMensajes(input),images,tier:opts.modelTier||'default'})})}
    catch(e){throw{code:e?.name==='AbortError'?'cancelled':'upstream_error',message:String(e)}}
    const out=await r.json().catch(()=>({}));
    if(!r.ok){if(out.code==='no_key'||out.code==='bad_key'){tieneLlave=false;return puente(input,opts,out.code==='bad_key'?'Tu API key no funcionó. Revísala en "Conexión con Claude".':'')}
      throw{code:out.code==='rate_limited'?'rate_limited':'upstream_error',message:out.message||''}}
    return{text:out.text,truncated:!!out.truncated};
  }
  function puente(input,opts={},aviso=''){
    const ms=aMensajes(input);
    const prompt=ms.length===1?ms[0].content:ms[0].content+'\n\n--- Conversación hasta ahora ---\n'+ms.slice(2).map(m=>(m.role==='user'?'ARTISTA: ':'TÚ: ')+m.content).join('\n\n')+'\n\n--- Responde ahora como "TÚ" al último mensaje del artista (solo tu respuesta). ---';
    return new Promise((resolve,reject)=>{
      const v=el(`<div class="pcx modal"><div class="pcx-card">
        <h2>Pregúntale a Claude</h2>
        ${aviso?`<p class="pcx-err">${escH(aviso)}</p>`:''}
        <p>1. Copia la pregunta. 2. Pégala en Claude${opts.images?' y <b>adjunta la imagen</b> (descárgala abajo)':''}. 3. Pega aquí su respuesta completa.</p>
        ${opts.images?'<div class="pcx-thumbs" id="pcx-th"></div>':''}
        <div class="pcx-row"><button class="btn pri" id="pcx-copy">Copiar pregunta</button><a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">Abrir Claude ↗</a></div>
        <textarea id="pcx-resp" placeholder="Pega aquí la respuesta de Claude"></textarea>
        <div class="pcx-row"><button class="btn pri" id="pcx-ok">Usar respuesta</button><button class="btn ghost" id="pcx-cancel">Cancelar</button>
        <span style="flex:1"></span><button class="pcx-link" id="pcx-cfg">Conectar Claude directo</button></div></div></div>`);
      document.body.append(v);
      const cerrar=()=>{v.remove();opts.signal?.removeEventListener('abort',abort)};
      const abort=()=>{cerrar();reject({code:'cancelled'})};
      opts.signal?.addEventListener('abort',abort);
      if(opts.images){const th=v.querySelector('#pcx-th');[...opts.images].forEach((b,i)=>{const u=URL.createObjectURL(b);
        th.append(el(`<a href="${u}" download="pieza-${i+1}.${(b.type.split('/')[1]||'jpg').replace('jpeg','jpg')}" title="Descargar para adjuntar"><img src="${u}" alt=""></a>`))})}
      v.querySelector('#pcx-copy').onclick=async e=>{try{await navigator.clipboard.writeText(prompt);e.target.textContent='Copiada ✓'}catch{const t=v.querySelector('#pcx-resp');t.value=prompt;t.select();e.target.textContent='Selecciona y copia'}};
      v.querySelector('#pcx-ok').onclick=()=>{const t=v.querySelector('#pcx-resp').value.trim();if(!t)return;cerrar();resolve({text:t,truncated:false,modelTierApplied:'default'})};
      v.querySelector('#pcx-cancel').onclick=abort;
      v.querySelector('#pcx-cfg').onclick=()=>{abort();ajustes()};
    });
  }
  function parseJSON(t){
    try{return JSON.parse(t)}catch{}
    const f=/```(?:json)?\s*([\s\S]*?)```/.exec(t);if(f){try{return JSON.parse(f[1])}catch{}}
    const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
    if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch{}}
    throw{code:'invalid_json',text:t};
  }

    document.body.append(v);
    const err=t=>v.querySelector('#pcx-kerr').textContent=t;
    v.querySelector('#pcx-x').onclick=()=>v.remove();
    v.querySelector('#pcx-quitar')?.addEventListener('click',async()=>{await sb.rpc('pc_set_secret',{p_value:''});tieneLlave=false;v.remove()});
    v.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const k=v.querySelector('#pcx-key').value.trim();
      if(!/^sk-ant-/.test(k)){err('Esa no parece una API key de Anthropic (empieza con sk-ant-).');return}
      const {error}=await sb.rpc('pc_set_secret',{p_value:k});if(error){err(error.message);return}
      tieneLlave=true;v.remove();});
  }

/* ============ Íconos ============ */

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};a=a[ks[i]]}a[ks.at(-1)]=v}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function fecha(ts){try{return new Date(ts).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch{return ''}}
function md(txt){
  const lines=esc(txt).split(/\n/);let out='',inUl=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*[-*•]\s+/.test(l)){if(!inUl){out+='<ul>';inUl=true}out+='<li>'+l.replace(/^\s*[-*•]\s+/,'')+'</li>';continue}
    if(inUl){out+='</ul>';inUl=false}
    if(/^#{1,4}\s/.test(l))out+='<h4>'+l.replace(/^#+\s/,'')+'</h4>';
    else if(l.trim())out+='<p>'+l+'</p>';
  }
  return out+(inUl?'</ul>':'');
}

function nuevoProyecto(nombre){
  return {nombre:nombre||'Proyecto sin nombre',tipo:'Personaje',encargo:'',estado:'Brief',creado:Date.now(),actualizado:Date.now(),
    brief:{texto:'',entregable:'',publico:'',restricciones:'',historia:''},nombres:[],
    concepto:{nucleos:['','',''],tension:'',tensionTexto:'',frase:'',empujes:[]},
    mundo:{},keywords:{forma:[],material:[],emocion:[],cultura:[],luz:[]},busquedas:[],
    mood:{sensacion:'',palabras:'',paleta:['#1b1d22','#6b2f2a','#c9b27a']},
    tecnica:{medio:'',acabado:'',referentes:''},
    pilares:[{t:'',f:''},{t:'',f:''},{t:'',f:''}],
    refs:[],piezas:[],encuadres:[],diseno:{},retro:{funciono:'',mejorar:'',aprendi:''}};
}
function normaliza(p){
  const base=nuevoProyecto();
  const merge=(b,x)=>{if(x==null)return b;if(Array.isArray(b))return Array.isArray(x)?x:b;
    if(typeof b==='object'&&b){const o={...b};for(const k in x)o[k]=k in b?merge(b[k],x[k]):x[k];return o}return x};
  const o=merge(base,p);
  while(o.concepto.nucleos.length<3)o.concepto.nucleos.push('');
  while(o.pilares.length<3)o.pilares.push({t:'',f:''});
  return o;
}
const AJUSTES_BASE={principios:[],referentes:[],gusto:''};

/* ============ Estado + almacenamiento ============ */
const S={db:null,assets:null,sample:null,downloads:null,modo:'cargando',
  P:{},ajustes:clone(AJUSTES_BASE),cur:null,vista:'inicio',tab:'brief',
  dirty:false,ajDirty:false,ai:{},aiBusy:{},provo:0,confirmDel:false,destinoCapa:'concepto'};
let saveT=null,ajT=null;

function lsGet(){try{return JSON.parse(localStorage.getItem('cdc.v1')||'null')}catch{return null}}
function lsSet(){try{localStorage.setItem('cdc.v1',JSON.stringify({P:S.P,ajustes:S.ajustes}))}catch{}}

function marcar(){const p=S.P[S.cur];if(!p)return;p.actualizado=Date.now();S.dirty=true;setStatus('Guardando…');clearTimeout(saveT);saveT=setTimeout(guardar,700)}
/* ---- historial: una foto del proyecto cada 15 min de trabajo, al abrirlo y antes de restaurar ---- */
const HIST_MAX=40;
function histLocal(){try{return JSON.parse(localStorage.getItem('cdc.hist')||'[]')}catch{return []}}
async function snapshot(id,forzar){
  const p=S.P[id];if(!p)return;S.lastSnap=S.lastSnap||{};
  if(!forzar&&Date.now()-(S.lastSnap[id]||0)<15*60e3)return;S.lastSnap[id]=Date.now();
  const ts=Date.now(),doc={pid:id,ts,nombre:p.nombre,pct:salud(p).pct,refs:p.refs.length,data:clone(p)};
  try{
    if(S.db){await S.db.collection('historial').doc(id+'~'+ts).set(doc);
      const todos=await histDe(id);for(const h of todos.slice(HIST_MAX))await S.db.collection('historial').doc(h.pid+'~'+h.ts).delete()}
    else{const h=histLocal();h.unshift(doc);const mine=h.filter(x=>x.pid===id);const fuera=new Set(mine.slice(HIST_MAX/4).map(x=>x.ts));
      try{localStorage.setItem('cdc.hist',JSON.stringify(h.filter(x=>x.pid!==id||!fuera.has(x.ts))))}catch{}}
  }catch{}
}
async function histDe(id){
  if(!S.db)return histLocal().filter(x=>!id||x.pid===id).sort((a,b)=>b.ts-a.ts);
  const q=id?S.db.collection('historial').where('pid','==',id):S.db.collection('historial');
  const s=await q.get();return s.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts);
}
async function verHistorial(){S.hist={cargando:true};renderMain();try{S.hist={lista:await histDe(S.cur)}}catch{S.hist={error:true}}renderMain()}
async function verPapelera(){S.papelera={cargando:true};renderMain();
  try{const todos=await histDe(null),vistos=new Set(),lista=[];
    for(const h of todos){if(S.P[h.pid]||vistos.has(h.pid))continue;vistos.add(h.pid);lista.push(h)}
    S.papelera={lista}}catch{S.papelera={error:true}}renderMain()}
async function guardar(){
  const id=S.cur,p=S.P[id];if(!p)return;
  try{
    if(S.db)await S.db.collection('proyectos').doc(id).set(clone(p));else lsSet();
    S.dirty=false;setStatus('Guardado');renderSide();snapshot(id);
  }catch(e){setStatus(e.code==='quota_exceeded'?'Sin espacio: borra proyectos viejos':'No se pudo guardar — reintenta editando');}
}
function marcarAj(){S.ajDirty=true;setStatus('Guardando…');clearTimeout(ajT);ajT=setTimeout(async()=>{
  try{if(S.db)await S.db.doc('ajustes/principios').set(clone(S.ajustes));else lsSet();S.ajDirty=false;setStatus('Guardado')}catch{setStatus('No se pudo guardar')}
},700)}
function setStatus(t){const el=$('#status');if(el)el.textContent=t}

async function arrancar(){
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):window.PC_SHIM?window.PC_SHIM.use(n):Promise.resolve(null);
  use('sample').then(s=>{S.sample=s;if(S.cur)renderMain()});
  use('downloads').then(d=>{S.downloads=d});
  use('assets').then(a=>{S.assets=a});
  const db=await use('db');
  if(db){
    S.db=db;S.modo='db';
    let primera=true;
    db.collection('proyectos').onSnapshot(snap=>{
      let tocoActual=false;
      for(const d of snap.docs){
        const data=d.data();
        if(d.id===S.cur&&(S.dirty||snap.metadata.hasPendingWrites))continue;
        const prev=S.P[d.id];
        if(prev&&prev.actualizado===data.actualizado)continue;
        S.P[d.id]=normaliza(clone(data));if(d.id===S.cur)tocoActual=true;
      }
      for(const id of Object.keys(S.P))if(!snap.docs.some(d=>d.id===id)&&!(id===S.cur&&S.dirty))delete S.P[id];
      if(primera){primera=false;elegirInicial();render();return}
      renderSide();
      if(tocoActual&&!document.activeElement?.closest('#main'))renderMain();
    },e=>{S.modo='error';render()});
    db.doc('ajustes/principios').onSnapshot(d=>{
      if(S.ajDirty)return;S.ajustes={...clone(AJUSTES_BASE),...(d.exists?clone(d.data()):{})};
      if(S.vista!=='proyecto'&&!document.activeElement?.closest('#main'))renderMain();
    },()=>{});
  }else{
    S.modo='local';const l=lsGet();
    if(l){for(const k in l.P)S.P[k]=normaliza(l.P[k]);S.ajustes={...clone(AJUSTES_BASE),...l.ajustes}}
    elegirInicial();render();
  }
}
function elegirInicial(){
  let h='';try{h=localStorage.getItem('cdc.cur')||''}catch{}
  const ids=ordenados().map(([id])=>id);

  if(!S.cur&&S.vista==='proyecto')S.vista='inicio';
}
function ordenados(){return Object.entries(S.P).sort((a,b)=>(b[1].actualizado||0)-(a[1].actualizado||0))}
function recordar(){try{localStorage.setItem('cdc.cur',S.cur||'')}catch{}}

/* ============ Salud del proceso ============ */
function salud(p){
  const refs=p.refs||[],conP=refs.filter(r=>(r.porque||'').trim().length>=8).length;
  const kwN=KWCATS.reduce((n,[k])=>n+(p.keywords[k]||[]).length,0),kwC=KWCATS.filter(([k])=>(p.keywords[k]||[]).length).length;
  const mundoN=MUNDO_Q.filter(([k])=>(p.mundo[k]||'').trim().length>3).length;
  const dis=DISENO.filter(([k])=>p.diseno[k]).length;
  const items=[
    ['Brief en tus propias palabras',(p.brief.texto||'').trim().length>40,'brief'],
    ['2–3 núcleos del concepto',p.concepto.nucleos.filter(x=>x.trim()).length>=2,'concepto'],
    ['Tensión elegida y explicada',!!p.concepto.tension&&(p.concepto.tensionTexto||'').trim().length>20,'concepto'],
    ['Concepto empujado (3+ empujes)',p.concepto.empujes.length>=3,'concepto'],
    ['Frase del concepto',(p.concepto.frase||'').trim().length>15,'concepto'],
    ['El mundo como personaje (4+ respuestas)',mundoN>=4,'mundo'],
    ['12+ keywords en 4+ categorías',kwN>=12&&kwC>=4,'keywords'],
    ['Búsquedas específicas (5+)',p.busquedas.length>=5,'keywords'],
    ['Mood: sensación y paleta',(p.mood.sensacion||'').trim().length>10&&p.mood.paleta.length>=3,'direccion'],
    ['Técnica definida',(p.tecnica.medio||'').trim().length>3,'direccion'],
    ['3 pilares con intención',p.pilares.every(x=>x.t.trim()&&x.f.trim().length>10),'direccion'],
    ['12+ referencias',refs.length>=12,'refs'],
    ['Cada referencia con su porqué',refs.length>0&&conP===refs.length,'refs'],
    ['Cada capa con 2+ referencias',LAYERS.every(l=>refs.filter(r=>r.capa===l.k).length>=2),'refs'],
    ['Checklist de diseño básico (6/8)',dis>=6,'revision'],
    ['Producción: 3+ etapas completas',pipeDe(p).filter((e,i)=>e.check.every((c,j)=>p.prod?.hechos?.[i+'-'+j])).length>=3,'produccion'],
    ['Crítica de al menos una pieza',(p.piezas||[]).some(x=>x.feedback),'critica'],
    ['Retro: qué aprendí',(p.retro.aprendi||'').trim().length>10,'revision']
  ];
  const ok=items.filter(i=>i[1]).length;
  return {items,ok,total:items.length,pct:Math.round(ok/items.length*100),conP,refs:refs.length};
}
function tabCompleta(p,t){const it=salud(p).items.filter(i=>i[2]===t);return it.length&&it.every(i=>i[1])}

/* ============ Render ============ */
function render(){renderSide();renderMain()}
function renderSide(){
  if(document.activeElement?.id==='f-buscar'){const l=$('#plist-proy');if(l)l.innerHTML=listaProyectos();return}

  const side=$('#side');side.classList.toggle('open',!!S.menu);
  side.innerHTML=`
    <div class="brand">Potenciador<br><em>de Conceptos</em><small>Concepto · Mood · Técnica · AD</small></div>
    <div class="plist">
      ${nav('inicio','home','Inicio')}

function listaProyectos(){
  const q=(S.q||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const todos=ordenados().filter(([,p])=>!q||norm(p.nombre+' '+p.tipo+' '+p.encargo).includes(q));
  const activos=todos.filter(([,p])=>p.estado!=='Archivado'),arch=todos.filter(([,p])=>p.estado==='Archivado');
  const item=([id,p])=>{const s=salud(p);return `<button class="pitem" data-act="abrir" data-id="${esc(id)}" aria-current="${S.vista==='proyecto'&&id===S.cur}">
      <span class="dotp" style="background:${s.pct>=75?'var(--ok)':s.pct>=35?'var(--c-tecnica)':'var(--ink3)'}"></span><span class="n">${esc(p.nombre)}</span><span class="s">${s.pct}%</span>
      <span class="meta">${esc(p.tipo)} · ${esc(p.estado)}</span></button>`};
  if(!todos.length)return `<p class="muted">${q?'Sin resultados.':'Todavía no hay proyectos.'}</p>`;
  return activos.map(item).join('')+(arch.length?`<button class="pitem" data-act="ver-arch"><span class="n" style="color:var(--ink3)">${S.verArch?'Ocultar':'Ver'} archivados (${arch.length})</span></button>${S.verArch?arch.map(item).join(''):''}`:'');
}

  const prom=ps.length?Math.round(ps.reduce((n,x)=>n+x[2].pct,0)/ps.length):0;
  const tens={};ps.forEach(([,p])=>{if(p.concepto.tension)tens[p.concepto.tension]=(tens[p.concepto.tension]||0)+1});
  const falla={};ps.forEach(([,,s])=>s.items.forEach(([n,ok])=>{if(!ok)falla[n]=(falla[n]||0)+1}));
  const top=Object.entries(falla).sort((a,b)=>b[1]-a[1]).slice(0,4);

    <div class="stat"><b>${refs}</b><span>referencias reunidas</span></div>

  <div class="box"><h3>Proyectos</h3><div class="tbl"><table><thead><tr><th>Proyecto</th><th>Tipo</th><th>Estado</th><th>Tensión</th><th style="text-align:right">Refs</th><th style="text-align:right">Salud</th></tr></thead>
    <tbody>${ps.map(([id,p,s])=>`<tr><td><button class="btn ghost sm" data-act="abrir" data-id="${esc(id)}">${esc(p.nombre)}</button></td><td>${esc(p.tipo)}</td><td>${esc(p.estado)}</td><td>${esc(p.concepto.tension||'—')}</td><td class="num">${s.refs}</td><td class="num">${s.pct}%</td></tr>`).join('')}</tbody></table></div>
    ${Object.keys(tens).length?`<p class="muted">Tensiones que usas: ${Object.entries(tens).map(([t,n])=>`${esc(t)} (${n})`).join(', ')}. Prueba una que nunca hayas usado.</p>`:''}</div>
  <div class="box"><h3>Lo que he aprendido</h3>${aprend.length?aprend.map(([,p])=>`<div class="learn"><small>${esc(p.nombre)} · ${fecha(p.actualizado)}</small>${p.retro.aprendi?esc(p.retro.aprendi):''}${p.retro.mejorar?`<div class="muted">A mejorar: ${esc(p.retro.mejorar)}</div>`:''}</div>`).join(''):'<p class="muted">Cuando cierres un proyecto, llena su retro en Revisión y aparecerá aquí.</p>'}</div>`}

/* ============ Asesor (Claude) ============ */
function asesor(kind,titulo,desc){
  if(!S.sample)return '';
  const r=S.ai[kind],busy=S.aiBusy[kind];
  let body='';
  if(busy)body=`<div class="aiout">${r?.stream?md(r.stream):'<p class="muted">Pensando…</p>'}</div>`;
  else if(r?.error)body=`<p class="muted">${esc(r.error)}</p>`;
  else if(r)body=aiRender(kind,r);
  return `<div class="asesor"><div class="top"><div><b>${titulo}</b><p class="muted" style="margin:2px 0 0">${desc}</p></div>
    <div class="prow">${busy?`<button class="btn sm" data-act="ai-stop" data-k="${kind}">Detener</button>`:`<button class="btn sm pri" data-act="ai" data-k="${kind}">${r?'Volver a preguntar':'Preguntar'}</button>`}</div></div>${body}</div>`}

function ctxProyecto(p,{refs=false}={}){
  const L=[`Proyecto: ${p.nombre} (${p.tipo})`,`Brief: ${p.brief.texto}`,p.brief.restricciones&&`Restricciones: ${p.brief.restricciones}`,
    `Núcleos: ${p.concepto.nucleos.filter(Boolean).join(' / ')}`,`Tensión: ${p.concepto.tension} — ${p.concepto.tensionTexto}`,
    p.concepto.frase&&`Frase: ${p.concepto.frase}`,p.concepto.empujes.length&&`Empujes: ${p.concepto.empujes.join(' | ')}`,
    `Mundo como personaje: ${MUNDO_Q.filter(([k])=>p.mundo[k]).map(([k,q])=>q+' '+p.mundo[k]).join(' ')}`,
    `Keywords: ${KWCATS.map(([k,n])=>n+': '+(p.keywords[k]||[]).join(', ')).join('; ')}`,
    `Mood: ${p.mood.sensacion} (${p.mood.palabras}); paleta ${p.mood.paleta.join(' ')}`,
    `Técnica: ${p.tecnica.medio}; acabado ${p.tecnica.acabado}; referentes ${p.tecnica.referentes}`,
    ...p.pilares.map((x,i)=>`Pilar ${i+1}: ${x.t} — ${x.f}`)];
  if(refs)L.push('Referencias:\n'+p.refs.map((r,i)=>`${i+1}. [${capaNombre(p,r.capa)}] ${r.porque||'(sin porqué)'}${r.fuente?' — '+r.fuente:''}`).join('\n'));
  L.push('Principios del artista: '+S.ajustes.principios.join(' | '));
  if(S.ajustes.gusto)L.push('Su gusto y estilo: '+S.ajustes.gusto);
  if(guiasTexto())L.push('Sus guías fundamentales (a quienes quiere llegar): '+guiasTexto());
  if(S.ajustes.referentes.length)L.push('Artistas que sigue: '+S.ajustes.referentes.map(r=>r.nombre).filter(Boolean).slice(0,30).join(', '));
  return L.filter(Boolean).join('\n').slice(0,14000);
}

async function comprimir(file,max=640,q=.72){
  const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);
}
async function subir(files){
  const p=S.P[S.cur];if(!p)return;
  const imgs=[...files].filter(f=>/^image\/(png|jpeg|webp|gif)$/.test(f.type));
  if(!imgs.length){toast('Solo imágenes PNG, JPG, WEBP o GIF');return}
  setStatus(`Subiendo ${imgs.length}…`);let n=0;
  for(const f of imgs){
    try{
      const r={id:uid(),capa:S.destinoCapa,porque:'',fuente:'',creado:Date.now()};
      Object.assign(r,await guardarImagen(f));
      p.refs.push(r);n++;

  }
  if(n){marcar();renderMain();toast(`${n} referencia${n>1?'s':''} añadida${n>1?'s':''}: escribe su porqué`)}
}

const COT_TIPOS=[['Personaje (diseño completo)',10,18,30],['Criatura',10,20,34],['Entorno / keyframe',8,16,28],['Key art / ilustración a color',12,22,40],['Prop / arma',5,10,18],['Ilustración editorial',6,12,20],['Portada (libro o álbum)',12,22,36],['Paquete de thumbnails / exploración',3,6,10],['Turnaround / orthos (adicional)',4,8,14]];
const COT_CLIENTE=[['Personal / indie',.8],['Estudio de videojuegos o animación',1],['Editorial',.9],['Publicidad / marca',1.4]];
const COT_USO=[['Portafolio / uso personal',1],['Comercial limitado',1.25],['Comercial amplio',1.6],['Exclusivo / cesión total',2]];
const COT_URG=[['Normal',1],['Rápida',1.3],['Urgente',1.6]];
function cotBase(){const a=S.ajustes.cot||{};return {tarifa:+a.tarifa||400,tc:+a.tc||18.5,nombre:a.nombre||'Sebastián Álvarez',contacto:a.contacto||'salvarezdelfin@gmail.com'}}
function cotDraft(){return S.cot=S.cot||{cliente:'',proyecto:'',tipo:2,compl:1,cant:1,rev:2,cliTipo:1,uso:1,urg:0,entrega:'',extraHoras:0,notas:''}}
function cotCalc(d){
  const b=cotBase(),t=COT_TIPOS[d.tipo]||COT_TIPOS[0],horasU=t[1+(+d.compl)]+(+d.extraHoras||0),cant=Math.max(1,+d.cant||1);
  const desc=Math.min(.2,(cant-1)*.05),horas=horasU*cant*(1-desc);
  const revExtra=Math.max(0,(+d.rev||0)-2)*.1;
  const mult=COT_CLIENTE[d.cliTipo][1]*COT_USO[d.uso][1]*COT_URG[d.urg][1]*(1+revExtra);
  const base=horas*b.tarifa,total=Math.round(base*mult/50)*50;
  return {horas:Math.round(horas*10)/10,base:Math.round(base),mult,total,minimo:Math.round(total*.85/50)*50,usd:Math.round(total/b.tc),anticipo:Math.round(total/2),desc};
}

function reglasTaller(p){return `${ROL}\n\n${ctxProyecto(p)}\n${p.brief.historia?'Historia: '+p.brief.historia.slice(0,3000):''}\n\nVas a construir CON él los 3 pilares de Art Direction de este proyecto. Los pilares son fundamentales: guían cada decisión. NO los decidas tú solo.\n- Haz UNA pregunta a la vez, corta y concreta, que parta de sus respuestas anteriores. Cuando ayude, ofrece 2-3 opciones de ejemplo para que reaccione.\n- Máximo 5 preguntas antes de proponer. Cubre: qué debe sentir quien lo vea, la verdad central del concepto, qué NUNCA debe pasar en el diseño, qué referencia o momento lo captura mejor, y qué lo hace distinto.\n- Al proponer, usa SUS palabras, di de qué respuesta sale cada pilar y pídele que los ajuste. Si pide cambios, ajústalos y explica qué cambió.\n- Un buen pilar: es una intención, no un objeto ("lo sagrado pesa", no "serpiente"); se nota visualmente; los 3 no se repiten; sirve para decir que no a una idea.\n- Siempre que propongas o ajustes pilares, termina el mensaje con una línea exacta: PILARES: [{"t":"nombre corto","f":"qué comunica y cómo se nota en el diseño"},{"t":"","f":""},{"t":"","f":""}]`}
function pilaresDe(txt){const m=/PILARES:\s*(\[[\s\S]*\])/.exec(txt||'');if(!m)return null;try{const a=JSON.parse(m[1]);return Array.isArray(a)&&a.length>=3?a.slice(0,3):null}catch{return null}}
function tallerHTML(p){
  if(!S.sample)return '';
  const t=p.taller||[],busy=S.aiBusy.taller;
  const ult=[...t].reverse().find(m=>m.role==='assistant'),prop=pilaresDe(ult?.content);
  return `<div class="asesor taller"><div class="top"><div><b>Taller de pilares · contigo</b><p class="muted" style="margin:2px 0 0">Te hace una pregunta a la vez y construye los 3 pilares con tus palabras. Tú decides.</p></div>
    ${t.length?`<button class="btn sm ghost" data-act="taller-reset">${S.confirmTaller?'¿Borrar la conversación?':'Empezar de nuevo'}</button>`:''}</div>
    ${t.length?`<div class="chat" id="chat">${t.map(m=>`<div class="msg ${m.role}">${m.role==='assistant'?md(m.content.replace(/PILARES:\s*\[[\s\S]*\]\s*$/,'').trim()):esc(m.content)}</div>`).join('')}${busy?`<div class="msg assistant" id="msg-live">${S.tallerLive?md(S.tallerLive.replace(/PILARES:[\s\S]*$/,'')):'<span class="muted">Pensando…</span>'}</div>`:''}</div>`:''}
    ${prop&&!busy?`<div class="grid3">${prop.map((x,i)=>`<div class="box pillar" style="background:var(--bg)"><span class="num">PILAR ${i+1}</span><b style="font-family:var(--display);font-size:20px;text-transform:uppercase">${esc(x.t)}</b><span class="muted" style="font-size:13px">${esc(x.f)}</span></div>`).join('')}</div>
      <div class="prow"><button class="btn pri" data-act="taller-aplicar">Aplicar a mis pilares</button><span class="muted">o dile qué cambiar abajo</span></div>`:''}
    ${busy?'<div class="prow"><button class="btn sm" data-act="ai-stop" data-k="taller">Detener</button></div>':t.length?`<div class="prow" style="align-items:flex-end"><textarea id="f-taller" placeholder="Tu respuesta… (Enter para enviar, Shift+Enter para salto de línea)" style="flex:1 1 260px;min-height:52px" data-enter="taller"></textarea><button class="btn pri" data-act="taller">Enviar</button></div>`:'<div><button class="btn pri" data-act="taller-start">Empezar el taller</button></div>'}
  </div>`}
async function turnoTaller(texto){
  const p=S.P[S.cur];if(!p||!S.sample||S.aiBusy.taller)return;
  p.taller=p.taller||[];p.taller.push({role:'user',content:texto});marcar();
  const ctl=new AbortController();S.aiBusy.taller=ctl;S.tallerLive='';renderMain();$('#chat')?.lastElementChild?.scrollIntoView({block:'nearest'});
  try{
    const turns=[{role:'user',content:reglasTaller(p)},{role:'assistant',content:'Entendido. Vamos a construirlos juntos, una pregunta a la vez.'},...p.taller.slice(-24)];
    const {text}=await S.sample(turns,{signal:ctl.signal,cache:false,onText:({text})=>{S.tallerLive=text;const el=$('#msg-live');if(el)el.innerHTML=md(text.replace(/PILARES:[\s\S]*$/,''))}});
    p.taller.push({role:'assistant',content:text});marcar();
  }catch(e){
    if(e?.code==='cancelled'){if(S.tallerLive)p.taller.push({role:'assistant',content:S.tallerLive})}
    else{p.taller.pop();toast(e?.code==='rate_limited'?'Demasiados mensajes seguidos. Espera un momento.':'No se pudo enviar. Intenta de nuevo.')}
  }
  delete S.aiBusy.taller;S.tallerLive='';renderMain();setTimeout(()=>{$('#f-taller')?.focus({preventScroll:true})},0);
}

async function pedirCritica(id){
  const p=S.P[S.cur],x=p?.piezas.find(z=>z.id===id);if(!x||!S.sample||S.critBusy)return;
  const ctl=new AbortController();S.critCtl=ctl;S.critBusy=id;S.critErr={...S.critErr,[id]:''};renderMain();
  try{
    let images;try{const lim=await S.sample.limits();if(lim?.images)images=[await blobDeRef(x)]}catch{}
    const prev=p.piezas.filter(z=>z.feedback&&z.creado<x.creado).slice(-1)[0];
    const r=await S.sample.json(`${ROL_CRITICA}\n\n${ctxProyecto(p)}\n\nTe muestra una pieza en etapa: ${x.etapa}.${x.nota?' Pide revisar específicamente: '+x.nota:''}${prev?`\nEn la iteración anterior (${prev.etapa}) le pidieron: ${prev.feedback.siguiente_paso||''}. Di explícitamente si lo resolvió.`:''}\n${images?'La imagen va adjunta. Obsérvala con detalle antes de opinar.':'Si no ves la imagen adjunta, dilo en "lectura" y no inventes lo que contiene.'}\n\nCritícala como en una revisión real de estudio (dailies de visual development en un estudio AAA o de cine), con tres revisores:\n1) Visual Development lead: lenguaje de formas, silueta y lectura en miniatura, diseño de forma grande/mediana/pequeña, ritmo, coherencia con el mundo.\n2) Concept Artist senior: diseño funcional y creíble (cómo se mueve, cómo se usa, cómo está construido), estructura/anatomía/perspectiva, storytelling en el diseño, detalle concentrado donde importa, materiales.\n3) Director de Arte: si comunica los 3 pilares y el mood, jerarquía y punto focal, composición, estructura de valores, temperatura y armonía de color, control de bordes, lógica de luz, y si sirve para producción (¿un modelador 3D o un equipo podría ejecutarlo?) y para un portafolio que contrate un estudio.\nReglas: juzga contra el estándar de la industria, no contra un estudiante; sé honesto aunque duela, sin inflar. Adapta la exigencia a la etapa (a un thumbnail se le pide lectura, idea y composición, no render). Cada corrección debe decir DÓNDE (zona de la imagen) y QUÉ hacer exactamente (ej. "baja el valor del fondo a la derecha 2 pasos para separar la silueta del hombro"). Nada genérico como "mejora la composición".\nResponde SOLO con JSON: {"lectura":"qué se lee en 3 segundos y si coincide con la intención","nivel":"una de: arranque | prometedor | sólido | listo para portafolio | nivel producción","industria":"a qué nivel profesional corresponde hoy y qué le falta exactamente para estar al nivel de un portafolio contratable en un estudio AAA o de cine","puntajes":[{"criterio":"Idea y diseño","nota":1-10,"comentario":"una línea"},{"criterio":"Silueta y lectura"},{"criterio":"Composición y punto focal"},{"criterio":"Valores"},{"criterio":"Color y luz"},{"criterio":"Forma y perspectiva"},{"criterio":"Storytelling"},{"criterio":"Pilares y mood"}],"revisores":[{"rol":"Visual Development","fortalezas":["2 cosas concretas"],"correcciones":[{"problema":"dónde y qué falla","solucion":"acción concreta","prioridad":"alta|media|baja"}]},{"rol":"Concept Artist",...},{"rol":"Director de Arte",...}],"encuadres":[{"nombre":"","descripcion":"cámara, lente y composición alternativa"}],"paintover":["pasos concretos en orden de un paintover que harías sobre esta imagen"],"referentes":[{"artista":"concept artist real de la industria","que_mirar":"qué pieza o aspecto de su trabajo resuelve este problema"}],"ejercicio":"un ejercicio de estudio corto (30-60 min) que ataque su mayor debilidad en esta pieza","siguiente_paso":"la acción más importante para la siguiente iteración"} con 3-4 correcciones por revisor, 3 encuadres y 2-3 referentes.`,{signal:ctl.signal,cache:false,modelTier:'complex',images});
    x.feedback=r;x.fbFecha=Date.now();marcar();
  }catch(e){
    if(e?.code!=='cancelled')S.critErr={...S.critErr,[id]:e?.code==='rate_limited'?'Demasiadas críticas seguidas. Espera un momento.':e?.code==='image_rejected'?'La imagen no se pudo enviar: prueba con un JPG más ligero.':'No se pudo pedir la crítica. Intenta de nuevo.'};
  }
  S.critBusy=null;renderMain();
}

const EXP={bg:'#f4f5f7',ink:'#14161a',ink2:'#4b515b',ink3:'#7a818c',concepto:'#2a3ccc',mood:'#962c74',tecnica:'#9c6604',p1:'#0c7563',p2:'#0c7563',p3:'#0c7563'};
const DISP='"Bricolage Grotesque", "Segoe UI", sans-serif',BODY='"IBM Plex Sans", "Segoe UI", sans-serif',MONO='"IBM Plex Mono", Consolas, monospace';
function exportBox(p){
  if(!p.refs.length)return '';
  return `<div class="box"><h3>Llevar a PureRef</h3>
    <p class="hint"><b>ZIP:</b> descomprime y arrastra la carpeta a PureRef. Cada capa llega con su lámina de título y las imágenes nombradas con su porqué. <b>PNG:</b> todo el moodboard en una sola imagen de alta resolución, con columnas, pilares y porqués. <b>Copiar</b> en cada imagen: Ctrl+V directo en PureRef.</p>
    <div class="prow"><button class="btn pri" data-act="exp-zip" ${S.exp?'disabled':''}>Descargar carpeta (.zip)</button><button class="btn" data-act="exp-png" ${S.exp?'disabled':''}>Moodboard en PNG</button><span class="status" id="exp-status">${esc(S.exp||'')}</span></div></div>`}
function expStatus(t){S.exp=t;const el=$('#exp-status');if(el)el.textContent=t||''}
async function blobDeRef(r){if(r.asset&&S.assets?.blob)return S.assets.blob(r.asset);const res=await fetch(refSrc(r));if(!res.ok)throw new Error('img');return res.blob()}
function slug(s,n=48){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,n).replace(/-+$/,'')||'ref'}
function envolver(ctx,txt,w){const out=[];for(const par of String(txt||'').split('\n')){let l='';for(const word of par.split(/\s+/)){const t=l?l+' '+word:word;if(ctx.measureText(t).width>w&&l){out.push(l);l=word}else l=t}out.push(l)}return out}
function lienzo(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const aBlob=(c,type='image/png',q)=>new Promise(r=>c.toBlob(r,type,q));

async function laminaCapa(p,l){
  const c=lienzo(1400,700),x=c.getContext('2d'),col=EXP[l.k];
  x.fillStyle=EXP.bg;x.fillRect(0,0,1400,700);x.fillStyle=col;x.fillRect(0,0,1400,22);
  x.fillStyle=col;x.font=`500 28px ${MONO}`;x.fillText(l.k.startsWith('p')?'ART DIRECTION':'CAPA',80,110);
  x.fillStyle=EXP.ink;x.font=`800 96px ${DISP}`;let y=210;
  for(const ln of envolver(x,capaNombre(p,l.k).replace(/^P\d · /,''),1240).slice(0,2)){x.fillText(ln,80,y);y+=100}
  const m=/^p(\d)$/.exec(l.k),desc=m?p.pilares[+m[1]-1]?.f:l.k==='mood'?(p.mood.sensacion||l.d):l.k==='tecnica'?(p.tecnica.medio||l.d):l.d;
  x.fillStyle=EXP.ink2;x.font=`400 36px ${BODY}`;y+=20;for(const ln of envolver(x,desc,1240).slice(0,6)){x.fillText(ln,80,y);y+=50}
  if(l.k==='mood')p.mood.paleta.forEach((cl,i)=>{x.fillStyle=cl;x.fillRect(80+i*110,600,90,60)});
  return aBlob(c);
}

async function exportZip(){
  const p=S.P[S.cur];if(!p||S.exp)return;
  if(!window.JSZip){toast('No cargó el empaquetador. Recarga la página.');return}
  await document.fonts?.ready;
  const zip=new JSZip(),raiz=zip.folder(slug(p.nombre,60));let n=0,fallos=0;
  const capas=LAYERS.filter(l=>p.refs.some(r=>r.capa===l.k));
  for(const [ci,l] of capas.entries()){
    const f=raiz.folder(`${ci+1}_${slug(capaNombre(p,l.k),40)}`);
    f.file('00_TITULO.png',await laminaCapa(p,l));
    const rs=p.refs.filter(r=>r.capa===l.k);
    for(const [i,r] of rs.entries()){
      expStatus(`Empaquetando ${++n} de ${p.refs.length}…`);
      try{const b=await blobDeRef(r);const ext=(b.type.split('/')[1]||'jpg').replace('jpeg','jpg');
        f.file(`${String(i+1).padStart(2,'0')}_${slug(r.porque)}.${ext}`,b)}catch{fallos++}
    }
  }
  expStatus('Armando moodboard…');
  try{raiz.file('00_MOODBOARD.png',await moodboardPNG(p))}catch{}
  raiz.file('00_HOJA.md',aMarkdown(p));
  expStatus('Comprimiendo…');
  const blob=await zip.generateAsync({type:'blob'});
  expStatus('');await guardarArchivo(slug(p.nombre,60)+'_pureref.zip',blob);
  if(fallos)toast(`${fallos} imagen(es) no se pudieron incluir`);
}

async function moodboardPNG(p){
  await document.fonts?.ready;
  const capas=LAYERS.filter(l=>p.refs.some(r=>r.capa===l.k));
  const COLW=560,GAP=48,PAD=96,W=PAD*2+capas.length*COLW+(capas.length-1)*GAP;
  const imgs={};await Promise.all(p.refs.map(async r=>{try{imgs[r.id]=await createImageBitmap(await blobDeRef(r))}catch{}}));
  const m=lienzo(10,10).getContext('2d');
  // cabecera
  const head=[];m.font=`800 110px ${DISP}`;const tl=envolver(m,p.nombre,W-PAD*2).slice(0,2);
  m.font=`400 40px ${BODY}`;const fl=p.concepto.frase?envolver(m,p.concepto.frase,Math.min(W-PAD*2,1900)).slice(0,3):[];
  const nuc=p.concepto.nucleos.filter(Boolean).join('  /  ');
  let H=PAD+tl.length*118+fl.length*54+(nuc?90:0)+40;
  const pilY=H;const hasPil=p.pilares.some(x=>x.t);if(hasPil)H+=230;
  const colY=H+40;
  // columnas
  const layout=capas.map(l=>{let y=0;const items=[];m.font=`400 24px ${BODY}`;
    const desc=envolver(m,(/^p\d$/.test(l.k)?p.pilares[+l.k[1]-1]?.f:l.d)||'',COLW-40).slice(0,4);y+=120+desc.length*32+24;
    for(const r of p.refs.filter(r=>r.capa===l.k)){const im=imgs[r.id];if(!im)continue;
      const h=Math.min(im.height*COLW/im.width,COLW*1.6);m.font=`400 22px ${BODY}`;
      const cap=envolver(m,r.porque||'(sin porqué)',COLW).slice(0,4);items.push({r,im,y,h,cap});y+=h+14+cap.length*30+(r.fuente?30:0)+36}
    return {l,desc,items,h:y}});
  H=colY+Math.max(...layout.map(c=>c.h),200)+PAD;
  const s=Math.min(1,16000/H,16000/W),c=lienzo(Math.round(W*s),Math.round(H*s)),x=c.getContext('2d');x.scale(s,s);
  x.fillStyle=EXP.bg;x.fillRect(0,0,W,H);x.textBaseline='alphabetic';
  let y=PAD+90;x.fillStyle=EXP.ink;x.font=`800 110px ${DISP}`;for(const t of tl){x.fillText(t,PAD,y);y+=118}
  x.fillStyle=EXP.ink2;x.font=`400 40px ${BODY}`;y-=40;for(const t of fl){y+=54;x.fillText(t,PAD,y)}
  if(nuc){y+=80;x.fillStyle=EXP.ink;x.font=`700 44px ${DISP}`;x.fillText(nuc,PAD,y);
    if(p.concepto.tension){const w=x.measureText(nuc).width;x.font=`500 24px ${MONO}`;x.fillStyle=EXP.concepto;x.fillText(p.concepto.tension.toUpperCase(),PAD+w+30,y-6)}}
  if(hasPil){const pw=(W-PAD*2-GAP*2)/3;p.pilares.forEach((pl,i)=>{const px=PAD+i*(pw+GAP),py=pilY+30;
    x.fillStyle=EXP.p1;x.fillRect(px,py,pw,6);x.font=`500 22px ${MONO}`;x.fillText('PILAR '+(i+1),px,py+46);
    x.fillStyle=EXP.ink;x.font=`700 40px ${DISP}`;x.fillText(pl.t||'—',px,py+100);
    x.fillStyle=EXP.ink2;x.font=`400 24px ${BODY}`;envolver(x,pl.f,pw).slice(0,3).forEach((t,j)=>x.fillText(t,px,py+140+j*32))})}
  layout.forEach((col,ci)=>{const cx=PAD+ci*(COLW+GAP),col0=colY,cl=EXP[col.l.k];
    x.fillStyle=cl;x.fillRect(cx,col0,COLW,10);x.font=`700 44px ${DISP}`;x.fillStyle=EXP.ink;
    x.fillText(envolver(x,capaNombre(p,col.l.k),COLW)[0],cx,col0+76);
    x.fillStyle=EXP.ink3;x.font=`400 24px ${BODY}`;col.desc.forEach((t,j)=>x.fillText(t,cx,col0+114+j*32));
    for(const it of col.items){const iy=col0+it.y;x.drawImage(it.im,0,0,it.im.width,Math.min(it.im.height,it.h*it.im.width/COLW),cx,iy,COLW,it.h);
      x.fillStyle=EXP.ink;x.font=`400 22px ${BODY}`;it.cap.forEach((t,j)=>x.fillText(t,cx,iy+it.h+34+j*30));
      if(it.r.fuente){x.fillStyle=EXP.ink3;x.font=`400 18px ${MONO}`;x.fillText(it.r.fuente,cx,iy+it.h+34+it.cap.length*30)}}});
  x.fillStyle=EXP.ink3;x.font=`400 20px ${MONO}`;x.fillText('Potenciador de Conceptos · '+fecha(Date.now()),PAD,H-40);
  return aBlob(c);
}
function copiarRef(r,btn){

    const pngP=blobDeRef(r).then(async b=>{if(b.type==='image/png')return b;const im=await createImageBitmap(b);const c=lienzo(im.width,im.height);c.getContext('2d').drawImage(im,0,0);return aBlob(c)});
    navigator.clipboard.write([new ClipboardItem({'image/png':pngP})]).then(()=>{toast('Copiada: pégala en PureRef con Ctrl+V');btn.textContent='✓'},()=>toast('Este navegador no deja copiar imágenes aquí; usa "Descargar carpeta"'));
  }catch{toast('Este navegador no deja copiar imágenes aquí; usa "Descargar carpeta"')}

/* ============ Exportar ============ */
function aMarkdown(p){
  const c=p.concepto,L=[`# ${p.nombre}`,`${p.tipo} · ${p.encargo||'Proyecto personal'} · ${fecha(p.creado)}`,''];
  if(c.frase)L.push(`> ${c.frase}`,'');
  L.push('## Brief',p.brief.texto||'—','');
  L.push('## Concepto',`**Núcleos:** ${c.nucleos.filter(Boolean).join(' / ')}`,`**Tensión:** ${c.tension||'—'} — ${c.tensionTexto}`);
  if(c.empujes.length)L.push('','**Empujes:**',...c.empujes.map(e=>'- '+e));
  L.push('','## El mundo como personaje',...MUNDO_Q.filter(([k])=>p.mundo[k]).map(([k,q])=>`- **${q}** ${p.mundo[k]}`),'');
  L.push('## Keywords',...KWCATS.map(([k,n])=>`- **${n}:** ${(p.keywords[k]||[]).join(', ')}`),'');
  if(p.busquedas.length)L.push('## Búsquedas',...p.busquedas.map(b=>`- [${capaNombre(p,b.capa)}] ${b.q}`),'');
  L.push('## Mood',p.mood.sensacion,`*${p.mood.palabras}* — paleta ${p.mood.paleta.join(' ')}`,'','## Técnica',p.tecnica.medio,p.tecnica.acabado,p.tecnica.referentes,'');
  L.push('## Art Direction',...p.pilares.map((x,i)=>`${i+1}. **${x.t}** — ${x.f}`),'');
  L.push('## Referencias',...LAYERS.flatMap(l=>{const rs=p.refs.filter(r=>r.capa===l.k);return rs.length?[`### ${capaNombre(p,l.k)}`,...rs.map(r=>`- ${r.porque||'(sin porqué)'}${r.fuente?' — '+r.fuente:''}`)]:[]}),'');
  if(p.retro.aprendi)L.push('## Aprendí',p.retro.aprendi);
  return L.join('\n');
}

  if(e.target.id==='f-destino')S.destinoCapa=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey)return;const t=e.target;
  if(t.dataset.kwadd){e.preventDefault();const v=t.value.trim();if(!v)return;const p=S.P[S.cur];
    v.split(',').map(x=>x.trim()).filter(Boolean).forEach(w=>{if(!p.keywords[t.dataset.kwadd].includes(w))p.keywords[t.dataset.kwadd].push(w)});
    marcar();renderMain();$('#kw-'+t.dataset.kwadd)?.focus()}

});
document.addEventListener('click',e=>{

});
document.addEventListener('keyup',e=>{if(e.key==='Escape')$('#overlay').innerHTML=''});
document.addEventListener('paste',e=>{
  if(S.vista!=='proyecto'||S.tab!=='refs')return;
