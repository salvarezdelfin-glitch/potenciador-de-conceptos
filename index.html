});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('#drop,.board');if(d&&S.tab==='refs'){e.preventDefault();$('#drop')?.classList.add('over')}});
document.addEventListener('dragleave',e=>{if(e.target.id==='drop')e.target.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest?.('#drop,.board');if(d&&S.tab==='refs'){e.preventDefault();$('#drop')?.classList.remove('over');subir(e.dataTransfer.files)}});

async function accion(a,el){
  const p=S.P[S.cur],ds=el.dataset;
  if(['abrir','vista','nuevo','abrir-tab'].includes(a))S.menu=false;
  switch(a){
    case 'nuevo':{const id=uid();S.P[id]=nuevoProyecto('Nuevo proyecto');S.cur=id;S.vista='proyecto';S.tab='brief';S.ai={};recordar();marcar();render();setTimeout(()=>{const t=$('#f-nombre');t?.focus();t?.select()},0);break}
    case 'abrir':S.cur=ds.id;S.vista='proyecto';S.ai={};S.confirmDel=false;S.hist=null;recordar();render();snapshot(ds.id);break;
    case 'vista':S.vista=ds.v;S.hist=null;render();if(ds.v==='papelera')verPapelera();break;
    case 'tab':S.tab=ds.tab;S.confirmDel=false;renderMain();window.scrollTo({top:0});break;
    case 'tension':p.concepto.tension=ds.v;marcar();renderMain();break;
    case 'provo':S.provo=(S.provo+1+Math.floor(Math.random()*(PROVOCACIONES.length-1)))%PROVOCACIONES.length;renderMain();break;
    case 'empuje':{const t=$('#f-empuje'),v=t?.value.trim();if(!v)return;
      p.concepto.empujes.push(`${v}  (← ${PROVOCACIONES[S.provo%PROVOCACIONES.length]})`);marcar();renderMain();$('#f-empuje')?.focus();break}
    case 'del-empuje':p.concepto.empujes.splice(+ds.i,1);marcar();renderMain();break;
    case 'kw-del':p.keywords[ds.kw].splice(+ds.i,1);marcar();renderMain();break;
    case 'bq':{const t=$('#f-bq'),v=t?.value.trim();if(!v)return;p.busquedas.push({q:v,capa:$('#f-bqcapa').value});marcar();renderMain();$('#f-bq')?.focus();break}
    case 'bq-del':p.busquedas.splice(+ds.i,1);marcar();renderMain();break;
    case 'combinar':{const pick=k=>{const a=p.keywords[k]||[];return a[Math.floor(Math.random()*a.length)]};
      const partes=[pick('forma')||pick('cultura'),pick('material'),pick('luz')||pick('emocion')].filter(Boolean);
      if(partes.length<2){toast('Agrega más keywords para combinar');return}
      const t=$('#f-bq');if(t){t.value=partes.join(' ');t.focus()}break}
    case 'pal-add':p.mood.paleta.push('#888888');marcar();renderMain();break;
    case 'pal-del':p.mood.paleta.splice(+ds.i,1);marcar();renderMain();break;
    case 'ref-del':{if(S.confirmRef!==ds.id){S.confirmRef=ds.id;renderMain();return}
      const i=p.refs.findIndex(r=>r.id===ds.id);const [r]=p.refs.splice(i,1);S.confirmRef=null;marcar();renderMain();
      break}
    case 'unzoom':$('#overlay').innerHTML='';break;
    case 'borrar':{if(!S.confirmDel){S.confirmDel=true;renderMain();return}
      const id=S.cur;clearTimeout(saveT);await snapshot(id,true);S.dirty=false;delete S.P[id];S.confirmDel=false;
      try{if(S.db)await S.db.collection('proyectos').doc(id).delete();else lsSet()}catch{}
      S.cur=ordenados()[0]?.[0]||null;if(!S.cur)S.vista='inicio';recordar();render();toast('Proyecto borrado');break}
    case 'cancel-del':S.confirmDel=false;renderMain();break;
    case 'taller-start':turnoTaller('Empecemos. Hazme la primera pregunta.');break;
    case 'taller':{const t=$('#f-taller'),v=t?.value.trim();if(v)turnoTaller(v);break}
    case 'taller-reset':if(!S.confirmTaller){S.confirmTaller=true;renderMain();return}S.confirmTaller=false;p.taller=[];marcar();renderMain();break;
    case 'taller-aplicar':{const ult=[...(p.taller||[])].reverse().find(m=>m.role==='assistant'),x=pilaresDe(ult?.content);if(!x)return;
      p.pilares=x.map(q=>({t:String(q.t||''),f:String(q.f||'')}));marcar();renderMain();toast('Pilares aplicados');break}
    case 't-go':{const t=S.timer;S.timer={fin:Date.now()+(t?t.resta:(+ds.min||30)*60e3)};if(S.timer.fin<=Date.now())S.timer={fin:Date.now()+(+ds.min||30)*60e3};renderMain();break}
    case 't-pausa':S.timer={resta:Math.max(0,S.timer.fin-Date.now())};renderMain();break;
    case 't-reset':S.timer=null;renderMain();break;
    case 'd-hecho':case 'd-deshacer':case 'd-otro':case 'd-usar-crit':case 'd-usar-ai':{
      const r=S.ajustes.rutina=S.ajustes.rutina||{dias:{}},k=hoyKey(),cur=ejercicioDeHoy(),nota=$('#d-nota')?.value||'';
      if(a==='d-hecho')r.dias[k]={...cur,nota,hecho:true,ts:Date.now()};
      else if(a==='d-deshacer'){if(r.dias[k])r.dias[k].hecho=false}
      else if(a==='d-otro'){const i=((cur.i??0)+1)%3;r.dias[k]={skill:cur.skill,texto:EJERCICIOS[cur.skill][i],i,nota}}
      else if(a==='d-usar-crit'){const u=Object.values(S.P).flatMap(p=>p.piezas||[]).filter(x=>x.feedback?.ejercicio).sort((a,b)=>(b.fbFecha||0)-(a.fbFecha||0))[0];if(u)r.dias[k]={skill:cur.skill,texto:u.feedback.ejercicio,nota}}
      else{const d=S.ai.diario?.data;if(d)r.dias[k]={skill:cur.skill,texto:d.ejercicio+(d.pasos?.length?' — '+d.pasos.join(' / '):''),nota}}
      marcarAj();renderSide();renderMain();if(a==='d-hecho')toast(`Hecho. Racha: ${racha()} día${racha()===1?'':'s'}`);break}
    case 'reto-otro':S.retoAI=null;S.retoSeed=(S.retoSeed||0)+1+Math.floor(Math.random()*97);S.timer=null;renderMain();break;
    case 'reto-proyecto':{const r=S.retoAI||retoLocal(S.retoSeed),id=uid(),tipo=r.tipo==='Key art'?'Key art':r.tipo;
      const titulo=r.proyecto||`${r.sujeto[0].toUpperCase()+r.sujeto.slice(1)}, ${r.genero}`;
      const np=nuevoProyecto('Reto · '+titulo);np.tipo=TIPOS.includes(tipo)?tipo:'Ilustración';np.encargo=r.estudio+' (reto de estudio)';
      np.brief.texto=(r.brief||`Diseña ${r.sujeto} para un proyecto de ${r.genero}.`)+(r.contexto_ad?.length?'\nNotas de AD: '+r.contexto_ad.join('; '):'');
      np.brief.entregable=Array.isArray(r.entregables)?r.entregables.join(' · '):r.entrega;np.brief.restricciones=(r.restricciones||[]).join(' · ')+` · Tiempo: ${Math.round((r.min||120)/60*10)/10} h`;
      S.P[id]=np;S.ajustes.retos=S.ajustes.retos||[];S.ajustes.retos.push({ts:Date.now(),titulo,pid:id});marcarAj();
      S.cur=id;S.vista='proyecto';S.tab='brief';recordar();marcar();render();toast('Reto convertido en proyecto');break}
    case 'pz-proponer':{const x=p.piezas.find(z=>z.id===ds.id);if(!x)return;
      if(x.pf){S.vista='portafolio';render();return}
      proponer(x,{titulo:p.nombre,disciplina:p.tipo==='Entorno'?'Environment Concept':p.tipo==='Key art'?'Keyframe / Key Art':p.tipo+' Design',seccion:/Personaje|Criatura/.test(p.tipo)?'characters':'projects'});marcar();renderMain();toast('Propuesta: revísala con tu asesor en Portafolio');break}
    case 'est-proponer':{const x=S.ajustes.estiloImgs?.[+ds.i];if(!x)return;if(!x.pf){proponer(x,{});marcarAj();toast('Propuesta para portafolio')}S.vista='portafolio';render();break}
    case 'pf-ok':{const k=ds.k,{x}=pfDe(k);if(!x?.pf)return;if(!(x.pf.titulo.trim()&&x.pf.revisada&&x.pf.mejor))return;
      if(S.confirmPf!==k){S.confirmPf=k;renderMain();return}S.confirmPf=null;x.pf.estado='aprobada';x.pf.aprobado=Date.now();guardarPf(k);render();toast('Visto bueno dado');break}
    case 'pf-revocar':{const {x}=pfDe(ds.k);if(!x?.pf)return;x.pf.estado='candidata';delete x.pf.aprobado;guardarPf(ds.k);render();break}
    case 'pf-publicada':{const {x}=pfDe(ds.k);if(!x?.pf)return;x.pf.estado='publicada';x.pf.publicada=Date.now();guardarPf(ds.k);render();break}
    case 'pf-quitar':{const {x}=pfDe(ds.k);if(!x)return;delete x.pf;guardarPf(ds.k);render();break}
    case 'pf-paquete':paquetePortafolio().catch(()=>{expStatus('');toast('No se pudo armar el paquete')});break;
    case 'fav':{const r=S.ajustes.referentes[+ds.i];if(!r)return;r.fav=!r.fav;marcarAj();renderMain();break}
    case 'cot-hist':cargarCotHist();break;
    case 'cot-copiar':{const d=cotDraft(),c=cotCalc(d),b=cotBase();const txt=cotTexto({folio:'(borrador)',ts:Date.now(),d,total:c.total,usd:c.usd,nombre:b.nombre,contacto:b.contacto});try{await navigator.clipboard.writeText(txt);toast('Copiada')}catch{toast('No se pudo copiar')}break}
    case 'cot-guardar':{const d=clone(cotDraft()),c=cotCalc(d),b=cotBase();
      let n=1;try{const s=S.db?await S.db.collection('cotizaciones').get():{docs:[]};n=1+s.docs.reduce((m,x)=>Math.max(m,+(String(x.id).split('-')[1])||0),0)}catch{}
      const folio='SA-'+String(n).padStart(4,'0'),q={folio,ts:Date.now(),d,total:c.total,usd:c.usd,horas:c.horas,cliente:d.cliente,proyecto:d.proyecto,estado:'Enviada',nombre:b.nombre,contacto:b.contacto};
      try{if(S.db)await S.db.collection('cotizaciones').doc(folio).set(q)}catch{toast('No se pudo guardar en el historial')}
      S.cotHist=null;await guardarArchivo(`cotizacion-${folio}.html`,cotHTMLDoc(q));renderMain();break}
    case 'cot-abrir':{const q=S.cotHist?.lista?.find(x=>x.folio===ds.f);if(q)await guardarArchivo(`cotizacion-${q.folio}.html`,cotHTMLDoc(q));break}
    case 'cot-del':{if(S.confirmCot!==ds.f){S.confirmCot=ds.f;renderMain();return}S.confirmCot=null;try{await S.db?.collection('cotizaciones').doc(ds.f).delete()}catch{}S.cotHist.lista=S.cotHist.lista.filter(x=>x.folio!==ds.f);renderMain();break}
    case 'etapa':p.prod=p.prod||{};p.prod.etapa=+ds.i;marcar();renderMain();break;
    case 'est-del':S.ajustes.estiloImgs.splice(+ds.i,1);marcarAj();renderMain();break;
    case 'nom-titulo':p.nombre=ds.v;marcar();render();toast('Título aplicado');break;
    case 'nom-guardar':{p.nombres=p.nombres||[];if(!p.nombres.includes(ds.v))p.nombres.push(ds.v);marcar();el.textContent='Guardado';el.disabled=true;const b=$('#nombres-guardados');if(b)b.innerHTML=nombresHTML(p);break}
    case 'nom-del':p.nombres.splice(+ds.i,1);marcar();renderMain();break;
    case 'ver-arch':S.verArch=!S.verArch;$('#plist-proy').innerHTML=listaProyectos();break;
    case 'hist':verHistorial();break;
    case 'hist-rest':{const ts=+ds.ts;if(S.confirmHist!==ts){S.confirmHist=ts;renderMain();return}
      const h=S.hist?.lista?.find(x=>x.ts===ts);if(!h)return;S.confirmHist=null;
      await snapshot(S.cur,true);S.P[S.cur]=normaliza(clone(h.data));marcar();S.hist=null;render();toast('Versión restaurada');break}
    case 'pap-rest':{const h=S.papelera?.lista?.find(x=>x.pid===ds.pid);if(!h)return;
      S.P[h.pid]=normaliza(clone(h.data));S.cur=h.pid;S.vista='proyecto';S.tab='brief';recordar();marcar();render();toast('Proyecto recuperado');break}
    case 'pr-add':S.ajustes.principios.push('');marcarAj();renderMain();$('#pr-'+(S.ajustes.principios.length-1))?.focus();break;
    case 'pr-del':S.ajustes.principios.splice(+ds.i,1);marcarAj();renderMain();break;
    case 'rf-add':S.ajustes.referentes.push({nombre:'',porque:''});marcarAj();renderMain();break;
    case 'rf-del':S.ajustes.referentes.splice(+ds.i,1);marcarAj();renderMain();break;
    case 'ai':preguntar(ds.k);break;
    case 'ai-stop':S.aiBusy[ds.k]?.abort();break;
    case 'ai-empuje':{const x=S.ai.concepto?.data?.empujes?.[+ds.i];if(x){p.concepto.empujes.push(x.idea);marcar();el.textContent='Guardado';el.disabled=true;renderSide()}break}
    case 'ai-kw':{const ws=S.ai.keywords?.data?.[ds.kw]||[];ws.forEach(w=>{if(!p.keywords[ds.kw].includes(w))p.keywords[ds.kw].push(String(w))});marcar();renderMain();break}
    case 'ai-bq':{const b=S.ai.keywords?.data?.busquedas?.[+ds.i];if(b){p.busquedas.push({q:String(b.q),capa:LAYERS.some(l=>l.k===b.capa)?b.capa:'concepto'});marcar();el.textContent='Añadida';el.disabled=true}break}
    case 'ai-est':{const b=S.ai.keywords?.data?.estudiar?.[+ds.i];if(b){p.busquedas.push({q:String(b.nombre),capa:LAYERS.some(l=>l.k===b.capa)?b.capa:'concepto'});marcar();el.textContent='Añadida';el.disabled=true}break}
    case 'ai-dir':{const x=S.ai.ideas?.data?.direcciones?.[+ds.i];if(!x)return;
      const vacio=!p.concepto.nucleos.some(n=>n.trim())&&!p.pilares.some(pl=>pl.t.trim());
      if(!vacio&&S.confirmDir!==+ds.i){S.confirmDir=+ds.i;renderMain();return}
      S.confirmDir=null;const nu=(x.nucleos||[]).map(String).slice(0,3);while(nu.length<3)nu.push('');
      p.concepto.nucleos=nu;p.concepto.tension=TENSIONES.some(t=>t[0]===x.tension)?x.tension:p.concepto.tension;
      p.concepto.tensionTexto=String(x.tensionTexto||'');p.concepto.frase=String(x.idea||'');
      (x.pilares||[]).slice(0,3).forEach((pl,j)=>{p.pilares[j]={t:String(pl.t||''),f:String(pl.f||'')}});
      if(x.mundo&&!p.mundo.rol)p.mundo.rol=String(x.mundo);
      if(x.mood){p.mood.sensacion=String(x.mood.sensacion||'');p.mood.palabras=String(x.mood.palabras||'');const pal=(x.mood.paleta||[]).filter(c=>/^#[0-9a-f]{6}$/i.test(c));if(pal.length>=3)p.mood.paleta=pal}
      if(x.tecnica){p.tecnica.medio=String(x.tecnica.medio||'');p.tecnica.acabado=String(x.tecnica.acabado||'');if(x.tecnica.referentes)p.tecnica.referentes=String(x.tecnica.referentes)}
      (x.busquedas||[]).forEach(b=>{if(b?.q&&!p.busquedas.some(y=>y.q===b.q))p.busquedas.push({q:String(b.q),capa:LAYERS.some(l=>l.k===b.capa)?b.capa:'concepto'})});

    case 'critica':pedirCritica(ds.id);break;

    case 'pz-del':{if(S.confirmRef!==ds.id){S.confirmRef=ds.id;renderMain();return}
      const i=p.piezas.findIndex(x=>x.id===ds.id);const [x]=p.piezas.splice(i,1);S.confirmRef=null;marcar();renderMain();
      break}
    case 'enc-save':{const e=S.ai.encuadres?.data?.encuadres?.[+ds.i];if(e){p.encuadres.push({nombre:String(e.nombre||''),camara:String(e.camara||''),composicion:String(e.composicion||'')});marcar();el.textContent='Guardado';el.disabled=true}break}
    case 'enc-del':p.encuadres.splice(+ds.i,1);marcar();renderMain();break;

      (o.busquedas||[]).forEach(q=>{q=String(q||'').trim();if(q&&!p.busquedas.some(b=>b.q===q))p.busquedas.push({q,capa:k})});

      else{try{await navigator.clipboard.writeText(txt);toast('Descarga no disponible: copiado al portapapeles')}catch{toast('Descarga no disponible aquí')}}break}

}
window.addEventListener('beforeunload',()=>{if(S.dirty)guardar()});
arrancar();
