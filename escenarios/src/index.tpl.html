<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0f">
<title>Modelador de escenarios</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c0f'/%3E%3Cpath d='M6 22 16 6l10 16z M6 22h20 M16 6v16' fill='none' stroke='%23ff6a3d' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--rail:#101217;--surface:#15181e;--surface2:#1d2129;--surface3:#272c36;--ink:#eef0f4;--ink2:#aab1bd;--ink3:#737b88;--line:#232731;--line2:#313744;--accent:#ff6a3d;--accent2:#ff8a5c;--accent-ink:#150a05;--accent-soft:rgba(255,106,61,.14)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.35 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:grid;height:100%;grid-template-columns:252px minmax(0,1fr) 344px;grid-template-rows:50px minmax(0,1fr) auto;grid-template-areas:"top top top" "left center right" "bar bar bar"}
#top{grid-area:top;overflow-x:auto;scrollbar-width:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--rail);border-bottom:1px solid var(--line)}
#top>*{flex:none}#top .brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}#top .brand svg{width:22px;height:22px}
#top input{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;color:var(--ink);min-width:0}#nombre{width:190px}#top input[type=search]{width:190px;margin-left:auto}
#left{grid-area:left;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#right{grid-area:right;background:var(--rail);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#center{grid-area:center;position:relative;min-width:0;min-height:0;background:#0b0c0f}#viewport{position:absolute;inset:0}#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#tools{position:absolute;left:8px;top:8px;z-index:3;display:flex;flex-direction:column;gap:3px;background:rgba(14,16,21,.92);border:1px solid var(--line2);border-radius:12px;padding:4px}
#tools .tl{width:34px;height:34px;border-radius:8px;border:0;background:transparent;cursor:pointer;font-size:17px;color:var(--ink2)}#tools .tl:hover{background:var(--surface2);color:var(--ink)}#tools .tl.on{background:var(--accent-soft);color:var(--accent)}#tools i{display:block;height:1px;background:var(--line2);margin:2px 4px}
#hint{position:absolute;left:54px;bottom:8px;z-index:2;color:#fff;font-size:11.5px;background:rgba(14,16,21,.7);padding:4px 9px;border-radius:8px;pointer-events:none;max-width:calc(100% - 70px)}
#vistaTag{position:absolute;right:10px;top:10px;z-index:2;background:rgba(14,16,21,.8);border:1px solid var(--line2);border-radius:8px;padding:3px 9px;font-size:11.5px;pointer-events:none}
#bar{grid-area:bar;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 8px;background:var(--rail);border-top:1px solid var(--line);min-height:0}#bar:empty{display:none}
.btn{background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--surface3)}.btn.pri{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:rgba(255,160,120,.5);color:var(--accent-ink);font-weight:600}.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}.btn.sm{padding:5px 11px}.btn[disabled]{opacity:.45;pointer-events:none}
.ch{background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;cursor:pointer}.ch:hover{background:var(--surface2)}.ch.xs{padding:3px 9px;font-size:12px}.ch.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:rgba(255,170,130,.55);color:var(--accent-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.lbl{color:var(--ink3);font-size:11px;margin-right:2px}.hint{color:var(--ink3);font-size:11.5px;margin:4px 0}.prow{display:flex;gap:6px;align-items:center}.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=text],input[type=number],input[type=search]{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:4px 7px}input:focus{outline:none;border-color:var(--accent)}input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line2);border-radius:6px;background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--accent)}.v3-s{display:flex;flex-direction:column;gap:1px;margin:6px 0}.v3-s span{display:flex;justify-content:space-between;color:var(--ink2)}.v3-s b{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink)}
.escc-h{padding:9px 11px;border-bottom:1px solid var(--line);font-weight:600;display:flex;gap:6px;align-items:center}.escc-s{flex:1;overflow:auto;padding:9px 11px;min-height:0}
.escc-row{display:flex;align-items:center;gap:5px;padding:3px 5px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden}.escc-row:hover{background:var(--surface2)}.escc-row.on{background:var(--accent-soft);color:var(--accent)}.escc-row.hid{opacity:.45}.escc-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.escc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.escc-card{border:1px solid var(--line2);border-radius:10px;padding:3px;text-align:center;cursor:pointer;font-size:10.5px;line-height:1.15}.escc-card:hover{background:var(--surface)}.escc-card.on{border-color:var(--accent);background:var(--accent-soft)}.escc-card img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface2);border-radius:8px;display:block;margin-bottom:2px}
.escc-num{display:grid;grid-template-columns:62px 1fr 1fr 1fr;gap:4px;align-items:center;margin:4px 0}.escc-num input{width:100%;min-width:0}.escc-sec{margin:12px 0 4px;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.escc-sw{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.escc-sw i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);cursor:pointer;display:block}
.escc-tabs{display:flex;gap:3px;padding:7px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#idea{display:none;position:absolute;left:54px;bottom:34px;width:min(430px,calc(100% - 70px));max-height:62%;overflow:auto;z-index:4;background:rgba(14,16,21,.95);border:1px solid var(--line2);border-radius:14px;padding:10px 12px}#idea .idea-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}#idea .idea-h b{flex:1}#idea .idea-tag{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:11px;white-space:nowrap}#idea .idea-f{margin:2px 0 4px;font-size:13.5px}#idea summary{cursor:pointer;color:var(--ink2);margin:4px 0}#idea ul,#idea ol{margin:2px 0 4px;padding-left:18px;color:var(--ink2)}@media(max-width:900px){#idea{left:8px;width:calc(100% - 16px);bottom:8px;max-height:70%}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:#1d2129;border:1px solid var(--line2);padding:8px 14px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:50}#toast.on{opacity:1;transform:translateX(-50%)}
*::-webkit-scrollbar{width:9px;height:9px}*::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:9px;border:2px solid transparent;background-clip:content-box}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:50px 50vh minmax(0,1fr) auto;grid-template-areas:"top" "center" "right" "bar"}#left{display:none}#right{border-left:0;border-top:1px solid var(--line)}#top input[type=search]{display:none}#nombre{width:120px}#top .brand span{display:none}#hint{display:none}#bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><svg viewBox="0 0 32 32"><path d="M6 22 16 6l10 16z M6 22h20 M16 6v16" fill="none" stroke="#ff6a3d" stroke-width="2.4" stroke-linejoin="round"/></svg><span>Modelador de escenarios</span></div>
    <input id="nombre" type="text" placeholder="Nombre de la escena" aria-label="Nombre de la escena">
    <button class="btn xs" id="bUndo" title="Deshacer (Ctrl+Z)">↶</button><button class="btn xs" id="bRedo" title="Rehacer (Ctrl+Shift+Z)">↷</button>
    <input type="search" data-ecsrch placeholder="Buscar en la escena…">
    <button class="btn xs" id="bLineart" title="Ver la escena como dibujo lineal (blanco con líneas negras) y volver al color">✏ Lineart</button><button class="btn xs pri" id="bIdea" title="Un lugar, una hora y un clima con la idea y lo que debe mostrar la pieza">💡 Idea de portafolio</button><button class="btn xs" id="bAbrir">Abrir</button><button class="btn xs" id="bGuardar">Guardar</button><button class="btn xs pri" id="bPng">Exportar PNG</button>
    <input type="file" id="archivo" accept=".json,application/json" hidden>
  </header>
  <aside id="left"></aside>
  <main id="center"><div id="tools"></div><div id="viewport"></div><div id="vistaTag"></div><div id="hint">Arrastra el fondo para girar · clic derecho o dos dedos para mover · rueda para acercar · toca una pieza para editarla</div></main>
  <aside id="right"></aside>
  <footer id="bar"></footer>
</div>
<script type="module">
/*__JS__*/
</script>
</body>
</html>
